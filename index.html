<script id="board-data" type="application/json">{"version":"0.8","updated":"2026-10-06（Asia/Taipei）","repo":"https://github.com/kuohappiness/Essence-Cards","ideas":[{"id":"I-001","title":"參考軟體功能蒐集專區","status":"待研究","summary":"在設計討論平台蒐集參考軟體功能，先研究 RemNote 與 Memory Toast 的閃卡體驗。","body":"摘要：在設計討論平台蒐集參考軟體功能，先研究 RemNote 與 Memory Toast 的閃卡體驗。\n\n來源：使用者提出。\n\n使用者原意：\n> 我們應該有一個專區，去蒐集其他類似的軟體的功能。例如閃卡功能可以參考 RemNote 或 Memory Toast。\n\n已確認定位：這是我們設計 Essence Cards 時使用的研究專區，保存參考連結、功能觀察與待研究方向，服務專案討論。專區本身不列為未來學習工具的功能需求。\n\n初始參考：\n- [RemNote](https://www.remnote.com/)\n- [Memory Toast](https://www.memory-toast.com/zh-TW)\n- [參考軟體研究筆記](references/software.md)\n\n助理提出的比較面向，尚未確認為產品需求：\n- 如何從教材或筆記建立閃卡，以及製卡的操作負擔。\n- 卡片形式、題目與原始內容的連結。\n- 複習安排、作答回饋與記憶進度。\n- 資料匯入、匯出及可攜性。\n\n下一步：之後挑選一個實際使用情境，逐項記錄觀察、值得借鑑的地方及不適合的地方；目前不要求先完成研究。\n\n待釐清：比較的深度與優先順序為何？哪些觀察值得轉成 Essence Cards 的功能提案？","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-002","title":"獲取來源與保留原文定位","status":"待釐清","summary":"討論文字、網頁、文件、圖片、影音、真題與既有筆記的匯入，以及來源追溯。","body":"摘要：討論文字、網頁、文件、圖片、影音、真題與既有筆記的匯入，以及來源追溯。\n\n來源：六大流程第 1 項；助理提出候選來源與實作處理方式。\n\n候選功能：\n- 貼上文字、截取網頁段落、匯入文件或圖片、影音轉文字。\n- 匯入真題、既有筆記；保留網址、頁碼或時間點，能回原文核對。\n- 區分整份資料與手動選取片段；保留人工修正入口。\n\n困難與提案：格式、版面與取用方式各異，純網頁跨來源讀取也有限制。先分批支援，不承諾任何網址皆可完整讀取；提供貼上與上傳作為可用入口。\n\n待釐清：優先支援什麼來源？資料如何保存？由使用者挑選多少、由工具協助萃取多少？掃描、表格、圖片與影音如何處理？\n\n依據：[C-007 六大流程](consensus.md#c-007-六大流程討論架構已確認)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-003","title":"概念筆記、相似關聯與比較表","status":"提案中","summary":"消化來源成概念筆記；討論內容、拆分、相似概念關聯、比較表及與其他材料的連接。","body":"摘要：消化來源成概念筆記；討論內容、拆分、相似概念關聯、比較表及與其他材料的連接。\n\n來源：使用者提出「消化來源資料，寫成概念筆記，相似概念關聯、建立比較表」；助理補充中心資料與可編輯關聯的設計。\n\n使用者原意：\n> 消化來源資料，寫成概念筆記，相似概念關聯、建立比較表。\n\n助理提案：\n- 萃取重點、白話解釋、例子與反例、用自己的話重述、層級綱要。\n- 區分收藏備查、需要理解與需要記住，避免所有資料都成為複習負擔。\n- 一則筆記可連多份來源；一個概念可連比較表、教材、考題與卡片。\n- AI 提出整理與關聯草稿，使用者可拆分、合併、核對、修改及決定是否採用。\n\n困難：概念拆分、關係與比較可能遺漏條件或建立錯誤關聯；需保留來源及修訂。\n\n待釐清：一則筆記包含哪些內容？粒度如何決定？如何跨來源整合？使用者怎麼理解與確認？筆記更新影響哪些材料？\n\n依據：[C-007 六大流程](consensus.md#c-007-六大流程討論架構已確認)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-004","title":"互動教材、記憶卡與考題閃卡","status":"提案中","summary":"依學習需要製作互動網頁與記憶卡，並釐清它們與考題閃卡的用途及關聯。","body":"摘要：依學習需要製作互動網頁與記憶卡，並釐清它們與考題閃卡的用途及關聯。\n\n來源：使用者提出互動式網頁與記憶卡；助理提出材料區分與有限模板。\n\n使用者原意：\n> 複雜概念，做成互動式網頁；需背誦資料，做成記憶卡。\n\n助理提案：\n- 互動網頁協助理解複雜關係；可先提供流程排序、圖片標註、條件調整等模板。\n- 記憶卡協助回想名詞、定義、順序、公式或圖片構造；題型尚未決定。\n- 考題閃卡檢驗理解、判斷與應用，與記憶卡共用概念筆記。\n- 同一概念可同時使用多種材料；初學與錯題補強時都可製作。\n\n困難與提案：互動教材需驗證內容、操作、手機顯示與執行隔離；先做有限模板，再擴充客製網頁。\n\n待釐清：何時需要互動材料？哪些互動形式值得做？材料怎麼編輯、保存與重用？兩種卡片的排程是否共用？\n\n依據：[C-007 六大流程](consensus.md#c-007-六大流程討論架構已確認)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-005","title":"依真題、筆記與錯題出題及評量","status":"待釐清","summary":"根據真題、概念筆記和歷次錯題製作模擬考題閃卡，記錄作答並檢驗理解與應用。","body":"摘要：根據真題、概念筆記和歷次錯題製作模擬考題閃卡，記錄作答並檢驗理解與應用。\n\n來源：使用者提出考題來源；助理補充主動回想、變式題、評分與可核對機制。\n\n使用者原意：\n> 出模擬考題閃卡（根據真題、筆記，以及歷次錯題）。\n\n助理提案：\n- 手動或 AI 草擬題目；候選形式包括問答、填空、圖片遮蔽、比較、解釋與情境題。\n- 先作答再看解析，保留評分要點、作答表現與相關概念。\n- 區分真題與生成題，保留題目來源及出題依據。\n- 以不同問法與新情境觀察應用，避免只測是否記得原題。\n- 題目與答案可申疑、修正；開放式評量方式待決定。\n\n困難：題意、答案、難度與 AI 判分可能不可靠。來源與人工修正不能視為正確性保證；需要實際題例驗證。\n\n待釐清：優先題型、真題使用方式、題目品質標準、難度、批改、提示、口述與作答紀錄如何設計？\n\n依據：[C-007 六大流程](consensus.md#c-007-六大流程討論架構已確認)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-006","title":"錯因診斷、補強與寫回概念筆記","status":"待驗證","summary":"針對錯題加強學習並更新概念筆記；先診斷錯因，再選擇補強方式與材料修訂。","body":"摘要：針對錯題加強學習並更新概念筆記；先診斷錯因，再選擇補強方式與材料修訂。\n\n來源：使用者提出錯題補強與寫回；助理提出錯因分類、可檢查更新與版本連動。\n\n使用者原意：\n> 針對錯題加強學習，寫回概念筆記。\n\n助理提案：\n- 區分不理解、概念混淆、遺忘、讀題問題，以及題目或答案本身有誤。\n- 依錯因重新解釋、比較、回想或練習；需要時補做互動教材或卡片。\n- 寫回修正理解與易錯提醒，避免每份解析都直接堆進概念筆記。\n- 提出可核對的筆記修改，保留修改前後與舊作答紀錄。\n- 筆記更新後找出受影響教材、題目與卡片，重新檢查。\n\n困難：從一次答錯推定原因可能誤判；錯誤更新可能傳到多份材料。診斷效果與補強效果均待驗證。\n\n待釐清：如何取得錯因證據？由誰確認？如何回寫與回復？關聯材料需要提醒還是協助修改？\n\n依據：[C-007 六大流程](consensus.md#c-007-六大流程討論架構已確認)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-007","title":"主題復盤、間隔複習與下週進度","status":"待釐清","summary":"定期檢視各主題學習狀況與錯誤率，安排下週學習並控制平日複習負擔。","body":"摘要：定期檢視各主題學習狀況與錯誤率，安排下週學習並控制平日複習負擔。\n\n來源：使用者提出復盤與下週安排；助理補充每日回想、紀錄判斷與可調整排程。\n\n使用者原意：\n> 定期復盤，掃描每個主題學習狀況、錯誤率，安排下週學習進度。\n\n助理提案：\n- 每週復盤決定學習方向與補強內容；平日排程安排間隔複習。\n- 檢視題數、題型、難度、最近練習時間、提示使用與反覆錯因。\n- 區分未學、不理解、記不住與會背但不會應用等學習狀況，判斷方法待驗證。\n- 資料不足時明示；依可用時間建議份量與計畫，允許使用者調整。\n\n困難：不能只用少量題目或熟悉原題的正確率判斷掌握；不能保證排程就能使知識永久不忘。\n\n待釐清：復盤指標、頻率、複習算法、工作量、提醒、計畫調整與完成紀錄如何設計？\n\n依據：[C-007 六大流程](consensus.md#c-007-六大流程討論架構已確認)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-008","title":"同一工具串接六流程與三個入口","status":"提案中","summary":"以共用概念、來源與學習紀錄串接六流程；候選入口為今日學習、主題工作區與學習回顧。","body":"摘要：以共用概念、來源與學習紀錄串接六流程；候選入口為今日學習、主題工作區與學習回顧。\n\n來源：使用者詢問如何把全部功能包含在同一工具；助理提出整合架構與介面方案，尚未採用。\n\n助理提案：\n- 以主題、概念筆記、相關學習活動串接；一題可涉及多概念，每次作答可追溯。\n- 今日學習：待複習、預定練習、待補強與未完成內容。\n- 主題工作區：來源、筆記、關聯、比較表、教材與考題。\n- 學習回顧：主題進度、錯誤分布、反覆錯因與下週計畫。\n- 作答後直接回相關概念，補充理解再練習；可從筆記、製卡、練習或複習進入，不強迫依序走完。\n\n困難：模組間關聯、狀態與版本需一致；功能多時仍要維持日常操作清楚。\n\n待釐清：是否採用這三個入口？主題與概念如何導覽？桌面與手機如何呈現？平台尚未決定。\n\n定位：這是未來學習工具的介面提案；現有 index.html 是討論與規劃畫板。\n\n依據：[C-007 六大流程](consensus.md#c-007-六大流程討論架構已確認)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-009","title":"來源核對、版本與資料可攜性","status":"提案中","summary":"將來源追溯、搜尋、人工更正、版本、匯出、備份與還原列為各流程共用能力。","body":"摘要：將來源追溯、搜尋、人工更正、版本、匯出、備份與還原列為各流程共用能力。\n\n來源：助理提出貫穿六流程的共用功能；具體格式與保存方式未確認。\n\n候選功能：\n- 來源定位與核對、搜尋、內容與題目修正。\n- 區分 AI 草稿、待確認與已核對內容，允許使用者控制採用。\n- 保留筆記修訂與學習材料關聯，舊作答紀錄不因新版內容而失去脈絡。\n- 筆記、附件、卡片、題目、作答紀錄與關聯均可匯出、備份與還原。\n\n困難：僅匯出文字可能失去排程、學習歷程與關聯；AI 會產出看似肯定但錯誤的內容，不能把生成結果直接當作確定事實。\n\n待釐清：哪些資料由使用者保存？格式、附件、版本、還原、同步與權限如何設計？AI 功能是否可選、可替換？\n\n依據：[C-007 六大流程](consensus.md#c-007-六大流程討論架構已確認)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-010","title":"先接通六流程，再深化功能","status":"提案中","summary":"完整藍圖涵蓋六流程；助理建議先做基本循環，再擴充來源、自動化、互動與評量。","body":"摘要：完整藍圖涵蓋六流程；助理建議先做基本循環，再擴充來源、自動化、互動與評量。\n\n來源：助理的開發順序與初步可行性判斷；第一版範圍與工期尚未確認。\n\n第一版候選：\n- 文字與基本文件匯入、保留來源。\n- 可編輯概念筆記、手動關聯與比較表。\n- 記憶卡、少量互動教材模板。\n- 基本題型、作答與錯題紀錄。\n- 訂正後提出筆記更新建議。\n- 基本複習、每週回顧與可調整計畫。\n\n後續深化候選：\n- 複雜版面、影音與更多來源。\n- 跨來源整合、重複與矛盾偵測。\n- 客製互動、變式題、開放式評量。\n- 關聯材料修訂與更細緻的弱點、排程分析。\n\n判斷：同一工具包含六流程在架構上可行；正確診斷缺口與有效補強最需要驗證。沒有成本、時程、準確率或學習成效承諾。\n\n待釐清：哪些功能對第一版不可少？自動化做到哪裡？如何用真實教材驗證？\n\n依據：[C-007 六大流程](consensus.md#c-007-六大流程討論架構已確認)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"}],"tasks":[{"id":"T-002","title":"明確界定學習情境與成功標準","status":"待討論","summary":"釐清誰使用、教材類型、時間限制及希望改善的表現","body":"下一步：釐清誰使用、教材類型、時間限制及希望改善的表現\n\n依據：[C-001](consensus.md#c-001-專案目標已確認)","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/tasks.md"},{"id":"T-004","title":"啟用設計討論平台的公開網址","status":"待設定","summary":"在 GitHub Pages 選擇 GitHub Actions，執行發布並確認討論平台可公開讀取","body":"下一步：在 GitHub Pages 選擇 GitHub Actions，執行發布並確認討論平台可公開讀取\n\n依據：[C-004](consensus.md#c-004-記錄與畫板的分工已確認)","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/tasks.md"},{"id":"T-005","title":"細化六大流程的功能與關聯","status":"待討論","summary":"依六流程補充與釐清資料進出、概念內容及可控操作；助理建議從概念筆記切入，順序未定","body":"下一步：依六流程補充與釐清資料進出、概念內容及可控操作；助理建議從概念筆記切入，順序未定\n\n依據：[C-007](consensus.md#c-007-六大流程討論架構已確認)","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/tasks.md"},{"id":"T-006","title":"釐清第一版範圍與自動化程度","status":"待討論","summary":"盤點候選功能的必要性、品質風險與驗證方式，再決定平台及分階段範圍","body":"下一步：盤點候選功能的必要性、品質風險與驗證方式，再決定平台及分階段範圍\n\n依據：[I-010](ideas.md#i-010-先接通六流程再深化功能提案中)","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/tasks.md"}],"consensus":[{"id":"C-001","title":"專案目標","status":"已確認","summary":"使用者曾製作基於間隔重複（spaced repetition）的 Obsidian 閃卡外掛，現希望重構新的軟體，以更有效率、更深入地萃取知識，在有限時間內學習更多內容，並對考試成績有所幫助。","body":"使用者曾製作基於間隔重複（spaced repetition）的 Obsidian 閃卡外掛，現希望重構新的軟體，以更有效率、更深入地萃取知識，在有限時間內學習更多內容，並對考試成績有所幫助。\n\n三個設計概念：知識萃取、利用閃卡複習、加強記憶。記憶與考試表現的改善是預期目標，實際成效與驗證方式尚未確定。\n\n理由：使用者明確表達以上目標與設計概念。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-002","title":"軟體名稱","status":"已確認","summary":"正式英文名稱為 Essence Cards；儲存庫名稱為 Essence-Cards。Essence 呼應知識精華，Cards 呼應閃卡複習。","body":"正式英文名稱為 **Essence Cards**；儲存庫名稱為 `Essence-Cards`。Essence 呼應知識精華，Cards 呼應閃卡複習。\n\n中文名稱暫緩，之後再決定。\n\n理由：使用者已選定英文名稱，並明確要求延後中文命名。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-003","title":"討論方式","status":"已確認","summary":"每輪聚焦一個核心問題，允許自由延伸，由助理整理需求、取捨與未解問題。","body":"- 每輪聚焦一個核心問題，允許自由延伸，由助理整理需求、取捨與未解問題。\n- 使用者需求、助理提案、待驗證假設分開標示；沒有反對不等於已同意。\n- 以真實教材驗證抽象需求；研究依據與產品假設分開記錄。\n- 階段收尾時檢查遺漏、矛盾及範圍偏移。\n\n狀態標示使用已確認、提案中、待驗證、暫緩、已排除／已取代。\n\n理由：方便逐步取得共識，並在換對話或開始開發時延續工作。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-004","title":"記錄與畫板的分工","status":"已確認","summary":"index.html 是共同規劃 Essence Cards 的設計討論平台，用來討論如何做出知識學習工具。畫板上的卡片代表討論事項，不是學習閃卡；學習工具本身的功能、架構與操作介面另行討論。","body":"`index.html` 是共同規劃 Essence Cards 的設計討論平台，用來討論如何做出知識學習工具。畫板上的卡片代表討論事項，不是學習閃卡；學習工具本身的功能、架構與操作介面另行討論。\n\n- 討論過程另存為文件，保留想法與決策的演變。\n- 畫板分區呈現待釐清點子、目前任務及最新、仍有效的已確認共識；新點子的收錄不等於採用。\n- 討論紀錄、歷史提案、已排除選項與過期結論不呈現在畫板上。\n- 畫板採固定分區的無限畫板，可縮放、拖曳、點選卡片查看當前細節，並切換文字綱要。\n- Markdown 保存內容來源，HTML 與綱要依同一來源生成並保持同步。\n\n理由：使用者希望能回顧討論經過，同時讓畫板集中顯示當下需要掌握的事項。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-005","title":"GitHub 與公開範圍","status":"已確認","summary":"專案使用公開儲存庫：https://github.com/kuohappiness/Essence-Cards。","body":"專案使用公開儲存庫：\u003chttps://github.com/kuohappiness/Essence-Cards>。\n\n- 本 repo 保存共識、討論紀錄、任務、其他新增文件、HTML 畫板及後續程式碼。\n- 以 repo 中的最新內容作為共同維護依據，有實質結論時更新文件並提交版本。\n- API 金鑰、登入憑證及私人學習資料不屬於公開專案內容。\n\n理由：使用者建立並指定此 repo，已同意專案公開。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-006","title":"先收集點子，再逐項釐清","status":"已確認","summary":"使用者可隨時提出零散點子，由助理先記錄在看板的待釐清區，保留原意，之後再逐項討論，不必先整理成完整規格。","body":"使用者可隨時提出零散點子，由助理先記錄在看板的待釐清區，保留原意，之後再逐項討論，不必先整理成完整規格。\n\n參考軟體功能蒐集專區屬於設計討論平台的研究資料，初始閃卡參考包括 RemNote 與 Memory Toast。研究後是否採用其中的具體功能，另行討論；專區本身不列為未來學習工具的功能需求。\n\n理由：使用者希望先保存討論中的想法，避免打斷發想，也希望有地方累積同類軟體的參考。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-007","title":"六大流程討論架構","status":"已確認","summary":"以「獲取來源、概念筆記、學習材料、考題練習、錯題補強、復盤安排」六大流程規劃 Essence Cards，逐項討論功能與關聯。","body":"摘要：以「獲取來源、概念筆記、學習材料、考題練習、錯題補強、復盤安排」六大流程規劃 Essence Cards，逐項討論功能與關聯。\n\n- 1. 獲取來源資料。\n- 2. 消化成概念筆記：理解與整理來源，關聯相似概念、建立比較表。\n- 3. 依學習需要製作材料：討論複雜概念的互動網頁與需背誦內容的記憶卡。\n- 4. 出題、作答與診斷：討論依真題、筆記與歷次錯題製作模擬考題閃卡。\n- 5. 錯題補強與筆記更新：補強後將修正理解寫回概念筆記。\n- 6. 定期復盤與學習安排：檢視主題學習狀況及錯誤率，安排後續學習。\n\n確認範圍：六大流程是後續討論的共同架構；具體功能、資料關聯、介面、自動化程度、平台與第一版範圍仍待釐清。更新畫板不等於逐項採用助理提案。\n\n理由：使用者希望以功能作為規劃藍圖，提出五點知識獲取到內化的想法；整合後明確表示「好，那我們就以上面的六大流程來做討論」。\n\n完整功能草案見[六大流程與功能藍圖](learning-blueprint.md)。具體候選方案與困難見[點子收集箱](ideas.md) I-002～I-010；討論演變見[本輪摘要](discussions/2026-10-06-learning-workflow.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"}],"references":[{"id":"R-001","title":"RemNote","status":"待盤點","summary":"使用者指定的閃卡參考；已找到官方閃卡文件，詳細體驗與功能比較待研究。","body":"摘要：使用者指定的閃卡參考；已找到官方閃卡文件，詳細體驗與功能比較待研究。\n\n來源：使用者指定。\n\n- [官方網站](https://www.remnote.com/)\n- [官方閃卡文件](https://help.remnote.com/en/collections/3370931-flashcards)\n- [Flashcard Basics](https://help.remnote.com/en/articles/8663109-flashcard-basics)\n\n查核紀錄：2026-10-06 已找到官方文件。尚未實際操作或完成系統性功能盤點。\n\n研究問題（助理提案）：從閱讀／筆記到製卡的操作如何銜接？複習時如何回到原始脈絡？\n\n功能觀察、優缺點與 Essence Cards 可借鑑之處：待研究。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/references/software.md"},{"id":"R-002","title":"Memory Toast","status":"待查核","summary":"使用者指定的閃卡參考；先保存網址，功能與使用體驗待查核。","body":"摘要：使用者指定的閃卡參考；先保存網址，功能與使用體驗待查核。\n\n來源：使用者指定。\n\n- [官方網站（使用者提供）](https://www.memory-toast.com/zh-TW)\n\n查核紀錄：2026-10-06 本次未能讀取頁面，無法據此確認功能；這不代表網站無法正常使用。\n\n研究問題（助理提案）：如何建立與整理卡片？複習流程和回饋如何呈現？\n\n功能觀察、優缺點與 Essence Cards 可借鑑之處：待研究。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/references/software.md"}]}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('board-data').textContent);
const stage=document.getElementById('stage'), board=document.getElementById('board'), dialog=document.getElementById('detail-dialog');
const groups=[['ideas','待釐清點子','先留下原意，之後逐項討論'],['tasks','目前任務','掌握進度與下一步'],['consensus','最新共識','已確認、目前有效的方向']];
let view='board', x=0, y=0, scale=1, drag=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeURL(raw,source){try{let url=new URL(raw,source);return ['https:','http:'].includes(url.protocol)?url.href:null}catch{return null}}
function inline(text,source){
 let out='', end=0;const pattern=/\[([^\]]+)\]\(([^\s)]+)\)|<(https?:\/\/[^>]+)>|\*\*([^*]+)\*\*|`([^`]+)`/g;let m;
 while((m=pattern.exec(text))){out+=esc(text.slice(end,m.index));if(m[1]||m[3]){const href=safeURL(m[2]||m[3],source);out+=href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(m[1]||m[3])}</a>`:esc(m[1]||m[3]);}else if(m[4])out+=`<strong>${esc(m[4])}</strong>`;else out+=`<code>${esc(m[5])}</code>`;end=pattern.lastIndex;}return out+esc(text.slice(end));
}
function markdown(text,source){return text.split(/\n\s*\n/).map(block=>{const lines=block.split('\n');if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>'<li>'+inline(l.slice(2),source)+'</li>').join('')+'</ul>';if(lines.every(l=>l.startsWith('> ')))return '<blockquote>'+inline(lines.map(l=>l.slice(2)).join('\n'),source)+'</blockquote>';return '<p>'+lines.map(l=>inline(l,source)).join('<br>')+'</p>';}).join('')}
function cardHTML(card,full=false){return `<div class="card-top"><span class="ident">${esc(card.id)}</span><span class="badge">${esc(card.status)}</span></div><h3>${esc(card.title)}</h3>`+(full?`<div class="detail">${markdown(card.body,card.source)}</div><a class="source" href="${esc(card.source)}" target="_blank" rel="noopener noreferrer">查看來源文件 ↗</a>`:`<p class="summary">${esc(card.summary)}</p><div class="card-foot"><span>查看細節</span><span aria-hidden="true">↗</span></div>`)}
function openCard(card){document.getElementById('detail-id').textContent=card.id+' / '+card.status;document.getElementById('detail-title').textContent=card.title;document.getElementById('detail-body').innerHTML=markdown(card.body,card.source);document.getElementById('detail-source').href=card.source;dialog.showModal()}
function render(){
 board.replaceChildren();board.className=view==='references'?'reference-grid':'board';stage.className='stage'+(view==='canvas'?' canvas':view==='outline'?' outline':'');board.style.transform='';document.querySelector('.reference-intro')?.remove();
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.getElementById('zoom').hidden=view!=='canvas';document.getElementById('hint').hidden=view==='canvas';document.getElementById('hint').textContent=view==='references'?'參考收錄 ≠ 決定採用':'點開卡片，查看原意與下一步';
 if(view==='references'){
  const intro=document.createElement('p');intro.className='reference-intro';intro.textContent='設計討論的研究資料：先比較其他軟體的閃卡功能與使用體驗，再討論可借鑑之處。每項參考保留來源與查核狀態。';stage.prepend(intro);
  data.references.forEach(card=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="card-top"><span class="ident">${esc(card.id)}</span><span class="badge">${esc(card.status)}</span></div><h2>${esc(card.title)}</h2><div class="detail">${markdown(card.body,card.source)}</div>`;board.append(el)});
 }else groups.forEach(([key,title,note])=>{const lane=document.createElement('section');lane.className='lane '+key;lane.innerHTML=`<div class="lanehead"><span class="dot" aria-hidden="true"></span><h2>${title}</h2><span class="count">${data[key].length}</span></div><p class="lane-description">${note}</p><div class="cards"></div>`;const holder=lane.querySelector('.cards');data[key].forEach(card=>{const el=document.createElement(view==='outline'?'article':'button');el.className='card';el.dataset.id=card.id;el.innerHTML=cardHTML(card,view==='outline');if(view!=='outline')el.addEventListener('click',()=>openCard(card));holder.append(el)});if(!data[key].length)holder.innerHTML='<p class="empty">目前沒有項目</p>';board.append(lane)});
 if(view==='canvas')requestAnimationFrame(fit);
}
function transform(){board.style.transform=`translate(${x}px,${y}px) scale(${scale})`;document.getElementById('scale').value=Math.round(scale*100)+'%'}
function fit(){if(view!=='canvas')return;scale=Math.min(1,(stage.clientWidth-30)/board.offsetWidth,(stage.clientHeight-30)/board.offsetHeight);scale=Math.max(.12,scale);x=(stage.clientWidth-board.offsetWidth*scale)/2;y=15;transform()}
function zoomAt(factor,cx=stage.clientWidth/2,cy=stage.clientHeight/2){const next=Math.max(.12,Math.min(2,scale*factor));x=cx-(cx-x)*next/scale;y=cy-(cy-y)*next/scale;scale=next;transform()}
document.getElementById('meta').textContent='共識 v'+data.version+' · '+data.updated;
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));
document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.getElementById('zoom-in').addEventListener('click',()=>zoomAt(1.2));document.getElementById('zoom-out').addEventListener('click',()=>zoomAt(1/1.2));document.getElementById('fit').addEventListener('click',fit);
stage.addEventListener('wheel',e=>{if(view!=='canvas')return;e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
stage.addEventListener('pointerdown',e=>{if(view!=='canvas'||e.target.closest('button,a')||e.button!==0)return;drag={id:e.pointerId,px:e.clientX,py:e.clientY,x,y};stage.setPointerCapture(e.pointerId);stage.classList.add('dragging')});
stage.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;x=drag.x+e.clientX-drag.px;y=drag.y+e.clientY-drag.py;transform()});
for(const event of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(event,()=>{drag=null;stage.classList.remove('dragging')});
window.addEventListener('resize',()=>{if(view==='canvas')fit()});render();
</script>
</body>
</html>
