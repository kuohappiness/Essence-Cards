<script id="board-data" type="application/json">{"version":"0.12","updated":"2026-10-06（Asia/Taipei）","repo":"https://github.com/kuohappiness/Essence-Cards","ideas":[{"id":"I-001","title":"參考軟體功能蒐集專區","status":"待研究","summary":"在設計討論平台蒐集參考軟體功能，先研究 RemNote 與 Memory Toast 的閃卡體驗。","body":"摘要：在設計討論平台蒐集參考軟體功能，先研究 RemNote 與 Memory Toast 的閃卡體驗。\n\n來源：使用者提出。\n\n使用者原意：\n> 我們應該有一個專區，去蒐集其他類似的軟體的功能。例如閃卡功能可以參考 RemNote 或 Memory Toast。\n\n已確認定位：這是我們設計 Essence Cards 時使用的研究專區，保存參考連結、功能觀察與待研究方向，服務專案討論。專區本身不列為未來學習工具的功能需求。\n\n初始參考：\n- [RemNote](https://www.remnote.com/)\n- [Memory Toast](https://www.memory-toast.com/zh-TW)\n- [參考軟體研究筆記](references/software.md)\n\n助理提出的比較面向，尚未確認為產品需求：\n- 如何從教材或筆記建立閃卡，以及製卡的操作負擔。\n- 卡片形式、題目與原始內容的連結。\n- 複習安排、作答回饋與記憶進度。\n- 資料匯入、匯出及可攜性。\n\n下一步：之後挑選一個實際使用情境，逐項記錄觀察、值得借鑑的地方及不適合的地方；目前不要求先完成研究。\n\n待釐清：比較的深度與優先順序為何？哪些觀察值得轉成 Essence Cards 的功能提案？","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-002","title":"獲取來源與保留原文定位","status":"待釐清","summary":"討論文字、網頁、文件、圖片、影音、真題與既有筆記的匯入，以及來源追溯。","body":"摘要：討論文字、網頁、文件、圖片、影音、真題與既有筆記的匯入，以及來源追溯。\n\n已確認方向（C-008）：保留來源與概念、材料的關聯，依需要選取整理內容；支援格式及操作方式仍待釐清。\n\n來源：早期來源獲取功能討論；助理提出候選來源與實作處理方式。\n\n候選功能：\n- 貼上文字、截取網頁段落、匯入文件或圖片、影音轉文字。\n- 匯入真題、既有筆記；保留網址、頁碼或時間點，能回原文核對。\n- 區分整份資料與手動選取片段；保留人工修正入口。\n\n困難與提案：格式、版面與取用方式各異，純網頁跨來源讀取也有限制。先分批支援，不承諾任何網址皆可完整讀取；提供貼上與上傳作為可用入口。\n\n待釐清：優先支援什麼來源？資料如何保存？由使用者挑選多少、由工具協助萃取多少？掃描、表格、圖片與影音如何處理？\n\n依據：[C-008、C-009 學習循環方向](consensus.md)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-003","title":"概念筆記、相似關聯與比較表","status":"提案中","summary":"消化來源成概念筆記；討論內容、拆分、相似概念關聯、比較表及與其他材料的連接。","body":"摘要：消化來源成概念筆記；討論內容、拆分、相似概念關聯、比較表及與其他材料的連接。\n\n已確認方向（C-008）：概念筆記是來源與各種學習材料共用的知識基礎；具體內容與拆分方式仍待釐清。\n\n來源：使用者提出「消化來源資料，寫成概念筆記，相似概念關聯、建立比較表」；助理補充中心資料與可編輯關聯的設計。\n\n使用者原意：\n> 消化來源資料，寫成概念筆記，相似概念關聯、建立比較表。\n\n助理提案：\n- 萃取重點、白話解釋、例子與反例、用自己的話重述、層級綱要。\n- 區分收藏備查、需要理解與需要記住，避免所有資料都成為複習負擔。\n- 一則筆記可連多份來源；一個概念可連比較表、教材、考題與卡片。\n- AI 提出整理與關聯草稿，使用者可拆分、合併、核對、修改及決定是否採用。\n\n困難：概念拆分、關係與比較可能遺漏條件或建立錯誤關聯；需保留來源及修訂。\n\n待釐清：一則筆記包含哪些內容？粒度如何決定？如何跨來源整合？使用者怎麼理解與確認？筆記更新影響哪些材料？\n\n依據：[C-008、C-009 學習循環方向](consensus.md)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-004","title":"互動教材、記憶卡與考題閃卡","status":"提案中","summary":"依學習需要製作互動網頁與記憶卡，並釐清它們與考題閃卡的用途及關聯。","body":"摘要：依學習需要製作互動網頁與記憶卡，並釐清它們與考題閃卡的用途及關聯。\n\n已確認方向（C-008）：學習材料連回概念，依需要選擇產出；互動模板、題型與製作操作仍為提案。\n\n來源：使用者提出互動式網頁與記憶卡；助理提出材料區分與有限模板。\n\n使用者原意：\n> 複雜概念，做成互動式網頁；需背誦資料，做成記憶卡。\n\n助理提案：\n- 互動網頁協助理解複雜關係；可先提供流程排序、圖片標註、條件調整等模板。\n- 記憶卡協助回想名詞、定義、順序、公式或圖片構造；題型尚未決定。\n- 考題閃卡檢驗理解、判斷與應用，與記憶卡共用概念筆記。\n- 同一概念可同時使用多種材料；初學與錯題補強時都可製作。\n\n困難與提案：互動教材需驗證內容、操作、手機顯示與執行隔離；先做有限模板，再擴充客製網頁。\n\n待釐清：何時需要互動材料？哪些互動形式值得做？材料怎麼編輯、保存與重用？兩種卡片的排程是否共用？\n\n依據：[C-008、C-009 學習循環方向](consensus.md)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-005","title":"依真題、筆記與錯題出題及評量","status":"待釐清","summary":"根據真題、概念筆記和歷次錯題製作模擬考題閃卡，記錄作答並檢驗理解與應用。","body":"摘要：根據真題、概念筆記和歷次錯題製作模擬考題閃卡，記錄作答並檢驗理解與應用。\n\n已確認方向（C-008）：評量後保存學習紀錄並連回題目與概念；題型、紀錄欄位及評分方式仍待釐清。\n\n來源：使用者提出考題來源；助理補充主動回想、變式題、評分與可核對機制。\n\n使用者原意：\n> 出模擬考題閃卡（根據真題、筆記，以及歷次錯題）。\n\n助理提案：\n- 手動或 AI 草擬題目；候選形式包括問答、填空、圖片遮蔽、比較、解釋與情境題。\n- 先作答再看解析，保留評分要點、作答表現與相關概念。\n- 區分真題與生成題，保留題目來源及出題依據。\n- 以不同問法與新情境觀察應用，避免只測是否記得原題。\n- 題目與答案可申疑、修正；開放式評量方式待決定。\n\n困難：題意、答案、難度與 AI 判分可能不可靠。來源與人工修正不能視為正確性保證；需要實際題例驗證。\n\n待釐清：優先題型、真題使用方式、題目品質標準、難度、批改、提示、口述與作答紀錄如何設計？\n\n依據：[C-008、C-009 學習循環方向](consensus.md)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-006","title":"錯因診斷、補強與寫回概念筆記","status":"待驗證","summary":"針對錯題加強學習並更新概念筆記；先診斷錯因，再選擇補強方式與材料修訂。","body":"摘要：針對錯題加強學習並更新概念筆記；先診斷錯因，再選擇補強方式與材料修訂。\n\n已確認方向（C-008）：依忘記、混淆、應用困難或題目有誤選擇補強，修訂先核對並保留版本；診斷效果仍待驗證。\n\n來源：使用者提出錯題補強與寫回；助理提出錯因分類、可檢查更新與版本連動。\n\n使用者原意：\n> 針對錯題加強學習，寫回概念筆記。\n\n助理提案：\n- 區分不理解、概念混淆、遺忘、讀題問題，以及題目或答案本身有誤。\n- 依錯因重新解釋、比較、回想或練習；需要時補做互動教材或卡片。\n- 寫回修正理解與易錯提醒，避免每份解析都直接堆進概念筆記。\n- 提出可核對的筆記修改，保留修改前後與舊作答紀錄。\n- 筆記更新後找出受影響教材、題目與卡片，重新檢查。\n\n困難：從一次答錯推定原因可能誤判；錯誤更新可能傳到多份材料。診斷效果與補強效果均待驗證。\n\n待釐清：如何取得錯因證據？由誰確認？如何回寫與回復？關聯材料需要提醒還是協助修改？\n\n依據：[C-008、C-009 學習循環方向](consensus.md)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-007","title":"主題復盤、間隔複習與下週進度","status":"待釐清","summary":"定期檢視各主題學習狀況與錯誤率，安排下週學習並控制平日複習負擔。","body":"摘要：定期檢視各主題學習狀況與錯誤率，安排下週學習並控制平日複習負擔。\n\n已確認方向（C-008）：本次評分、間隔複習與主題復盤分工，依紀錄安排下一輪學習；指標與排程規則仍待釐清。\n\n來源：使用者提出復盤與下週安排；助理補充每日回想、紀錄判斷與可調整排程。\n\n使用者原意：\n> 定期復盤，掃描每個主題學習狀況、錯誤率，安排下週學習進度。\n\n助理提案：\n- 每週復盤決定學習方向與補強內容；平日排程安排間隔複習。\n- 檢視題數、題型、難度、最近練習時間、提示使用與反覆錯因。\n- 區分未學、不理解、記不住與會背但不會應用等學習狀況，判斷方法待驗證。\n- 資料不足時明示；依可用時間建議份量與計畫，允許使用者調整。\n\n困難：不能只用少量題目或熟悉原題的正確率判斷掌握；不能保證排程就能使知識永久不忘。\n\n待釐清：復盤指標、頻率、複習算法、工作量、提醒、計畫調整與完成紀錄如何設計？\n\n依據：[C-008、C-009 學習循環方向](consensus.md)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-008","title":"同一工具整合學習循環與三個入口","status":"提案中","summary":"以共用概念、來源與學習紀錄串接輸入、整理、學習與回饋；候選入口為今日學習、主題工作區與學習回顧。","body":"摘要：以共用概念、來源與學習紀錄串接輸入、整理、學習與回饋；候選入口為今日學習、主題工作區與學習回顧。\n\n已確認方向（C-008、C-011）：以概念筆記為核心的學習工作區，主題為入口、概念可跨主題共用；依閱讀、整理理解、記憶練習與回顧情境呈現 UI，修訂可回寫共用筆記。今日學習、主題工作區與學習回顧是否固定為三個主要入口，仍未確認。\n\n來源：使用者詢問如何把全部功能包含在同一工具；助理提出整合架構與介面方案；共用資料方向已確認，三個入口未確認。\n\n助理提案：\n- 以主題、概念筆記、相關學習活動串接；一題可涉及多概念，每次作答可追溯。\n- 今日學習：待複習、預定練習、待補強與未完成內容。\n- 主題工作區：來源、筆記、關聯、比較表、教材與考題。\n- 學習回顧：主題進度、錯誤分布、反覆錯因與下週計畫。\n- 作答後直接回相關概念，補充理解再練習；可從筆記、製卡、練習或複習進入，不強迫依序走完。\n\n困難：模組間關聯、狀態與版本需一致；功能多時仍要維持日常操作清楚。\n\n待釐清：是否採用這三個固定入口？主題與概念如何導覽？不同情境如何切換並保留操作位置？桌面與手機如何呈現？平台尚未決定。\n\n定位：這是未來學習工具的介面提案；現有 index.html 是討論與規劃畫板。\n\n依據：[C-008、C-009 學習循環方向](consensus.md)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-009","title":"來源核對、版本與資料可攜性","status":"提案中","summary":"將來源追溯、搜尋、人工更正、版本、匯出、備份與還原列為各流程共用能力。","body":"摘要：將來源追溯、搜尋、人工更正、版本、匯出、備份與還原列為各流程共用能力。\n\n已確認方向（C-008）：保留來源關聯，修訂可核對並保留版本；匯出、備份、還原與同步方式仍為提案。\n\n來源：助理提出貫穿學習循環的共用功能；具體格式與保存方式未確認。\n\n候選功能：\n- 來源定位與核對、搜尋、內容與題目修正。\n- 區分 AI 草稿、待確認與已核對內容，允許使用者控制採用。\n- 保留筆記修訂與學習材料關聯，舊作答紀錄不因新版內容而失去脈絡。\n- 筆記、附件、卡片、題目、作答紀錄與關聯均可匯出、備份與還原。\n\n困難：僅匯出文字可能失去排程、學習歷程與關聯；AI 會產出看似肯定但錯誤的內容，不能把生成結果直接當作確定事實。\n\n待釐清：哪些資料由使用者保存？格式、附件、版本、還原、同步與權限如何設計？AI 功能是否可選、可替換？\n\n依據：[C-008、C-009 學習循環方向](consensus.md)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-010","title":"先接通學習循環，再深化功能","status":"提案中","summary":"完整藍圖整合知識學習與回饋；助理建議先做基本循環，再擴充來源、自動化、互動與評量。","body":"摘要：完整藍圖整合知識學習與回饋；助理建議先做基本循環，再擴充來源、自動化、互動與評量。\n\n來源：助理的開發順序與初步可行性判斷；第一版範圍與工期尚未確認。\n\n第一版候選：\n- 文字與基本文件匯入、保留來源。\n- 可編輯概念筆記、手動關聯與比較表。\n- 記憶卡、少量互動教材模板。\n- 基本題型、作答與錯題紀錄。\n- 訂正後提出筆記更新建議。\n- 基本複習、每週回顧與可調整計畫。\n\n後續深化候選：\n- 複雜版面、影音與更多來源。\n- 跨來源整合、重複與矛盾偵測。\n- 客製互動、變式題、開放式評量。\n- 關聯材料修訂與更細緻的弱點、排程分析。\n\n判斷：同一工具整合學習循環在架構上可行；正確診斷缺口與有效補強最需要驗證。沒有成本、時程、準確率或學習成效承諾。\n\n待釐清：哪些功能對第一版不可少？自動化做到哪裡？如何用真實教材驗證？\n\n依據：[C-008、C-009 學習循環方向](consensus.md)。完整內容與查核來源見[功能藍圖](learning-blueprint.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-011","title":"承載學習循環的概念筆記結構","status":"提案中","summary":"使用者詢問是否需要打造新的概念筆記；助理建議先定義共用內容模型，保留自然編輯方式，以來源、概念關係及版本支援跨介面使用與回寫。","body":"摘要：使用者詢問是否需要打造新的概念筆記；助理建議先定義共用內容模型，保留自然編輯方式，以來源、概念關係及版本支援跨介面使用與回寫。\n\n來源：使用者在確認多情境 UI 共用筆記資料後提出疑問；尚未確認概念筆記的具體結構。\n\n使用者原意：\n> 如果是這樣，你覺得我們會不會需要打造一個新的概念筆記來承載這些流程？\n\n助理提案：\n- 先設計可共用、可追溯、可修訂的概念筆記內容模型，再決定編輯介面與儲存技術。\n- 人閱讀的內容保留自由文字、圖片、例子、條件及比較等表達方式；來源、概念關係與版本由系統協助管理。\n- 題目、卡片與互動教材連回概念；作答、錯因與複習歷程另存關聯紀錄，避免混入筆記正文。\n- 概念需有穩定識別以維持引用；「一個概念」是否等於「一個頁面」仍待討論，可評估頁面內概念片段的引用方式。\n- 以一則真實教材筆記檢查跨情境使用與修訂需求；先保留可讀與可匯出的設計空間，具體格式仍待選定。\n\n待釐清：最小必要內容、概念粒度、跨筆記引用、來源定位、材料版本連動，以及一般筆記如何逐步整理成概念筆記。\n\n依據：[C-011](consensus.md)、[T-005](tasks.md)及[本次討論摘要](discussions/2026-10-06-shared-knowledge-workspace.md)。這些為助理提案，尚未成為已確認欄位或技術選型。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-012","title":"跨模型 AI 協作與任務交接","status":"待釐清","summary":"使用者提出概念筆記應讓不同語言模型順暢介入、接續任務並協助判斷；助理建議共同設計筆記結構、任務脈絡與一致的讀寫介面，減少對特定模型或聊天紀錄的依賴。","body":"摘要：使用者提出概念筆記應讓不同語言模型順暢介入、接續任務並協助判斷；助理建議共同設計筆記結構、任務脈絡與一致的讀寫介面，減少對特定模型或聊天紀錄的依賴。\n\n來源：使用者指出許多內容判斷需要 AI，詢問概念筆記是否應在設計時支援各種語言模型介入與接管。此為新增點子，具體方案尚未確認。\n\n使用者原意：\n> 很多的內容判斷都需要 AI 協助介入，所以整個概念筆記的設計，是否也應該能讓各種不同的語言模型可以無痛的介入接管並執行判斷？\n\n助理提案：\n- 概念筆記保留人容易閱讀的正文，並提供明確的概念識別、來源定位、關聯、修訂版本及內容狀態，協助模型區分原始資料、使用者理解、AI 建議與已確認內容。\n- 每次任務提供目標、必要概念與來源、相關學習紀錄、限制及預期產出；依任務選取脈絡，避免每次都傳送全部資料庫。\n- 任務進度、已採用結果、依據與未解問題保存在系統中；替換模型時可讀取並接續。這是可交接的工作紀錄，並非轉移模型內部推理狀態。\n- 建立一致的搜尋、讀取、提出修訂、建立題目與回報判斷方式，再由各模型的轉接層處理呼叫差異；概念筆記不綁定單一供應商的對話格式。\n- 模型回傳修改對象、依據、理由、待確認事項及建議變更；系統檢查資料格式、引用及版本衝突，再依既有 C-008、C-011 原則處理確認與寫入。格式檢查不代表知識內容正確。\n- 模型可替換與能否完成特定任務分開驗證；首批支援範圍、圖片等輸入需求、工具能力、成本及品質標準仍待規劃。\n\n待釐清：AI 可自動執行哪些操作？哪些修訂需要確認？任務交接的最小脈絡、共通輸出、失敗處理及相容性驗證如何設計？\n\n依據：[I-011 概念筆記結構](ideas.md)、[T-005、T-006](tasks.md)及[本次討論摘要](discussions/2026-10-06-model-independent-ai.md)。本提案沒有選定模型、API、儲存格式或自動化權限，也不承諾所有模型可零成本互換。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"},{"id":"I-013","title":"電腦管理與手機複習的跨裝置使用","status":"待釐清","summary":"使用者提出由電腦處理輸入、修改與筆記管理，由手機提供低阻力的隨手複習；整套架構需考慮跨裝置使用及共用資料。","body":"摘要：使用者提出由電腦處理輸入、修改與筆記管理，由手機提供低阻力的隨手複習；整套架構需考慮跨裝置使用及共用資料。\n\n來源：使用者新增裝置分工想法並詢問助理看法；功能邊界、同步機制與實作平台尚待細化。\n\n使用者原意（摘要）：輸入資料、修改與管理筆記由電腦端處理；複習知識從手機隨時打開的阻力較低，因此架構應可跨裝置使用。\n\n助理提案：\n- 電腦端聚焦來源匯入、筆記編輯、概念整理、教材管理及 AI 修訂確認；手機端聚焦待複習內容、作答、解析與必要的概念回看。\n- 手機使用情境單獨設計，首頁可快速開始或接續短時間複習；實際操作數、呈現方式及份量需驗證。\n- 手機雖以複習為主，仍需寫回作答、評量、提示使用、進度與複習事件；共用系統應同步知識內容及學習狀態。\n- 設計裝置間的內容版本、複習進度、事件識別與衝突處理，避免同一作答重送造成重複計算，或手機舊內容覆蓋電腦修訂。\n- 手機發現內容疑問可標記待處理，再回電腦集中修改；此為低負擔回饋操作提案，不預設手機需要完整筆記編輯器。\n- 建議日常手機複習不依賴電腦保持開機；可評估預先準備教材與部分離線複習，連線後補同步紀錄。離線範圍、教材更新及 AI 可用性另行設計。\n- 與 I-012 銜接：AI 任務狀態及已採用結果由系統保存，讓裝置切換與模型替換可各自處理；一般複習可先使用已準備內容。\n\n待釐清：手機支援哪些題型與互動？哪些操作需連線？離線與同步如何取捨？跨裝置身分、附件保存、內容版本、複習排程及衝突如何處理？\n\n依據：[C-011 多情境介面](consensus.md)、[T-005、T-006](tasks.md)及[本次討論摘要](discussions/2026-10-06-cross-device-study.md)。尚未選定網頁、桌面或手機 App、雲端、自架或具體同步技術。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/ideas.md"}],"tasks":[{"id":"T-002","title":"明確界定學習情境與成功標準","status":"待討論","summary":"釐清誰使用、教材類型、時間限制及希望改善的表現","body":"下一步：釐清誰使用、教材類型、時間限制及希望改善的表現\n\n依據：[C-001](consensus.md#c-001-專案目標已確認)","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/tasks.md"},{"id":"T-004","title":"啟用設計討論平台的公開網址","status":"待設定","summary":"在 GitHub Pages 選擇 GitHub Actions，執行發布並確認討論平台可公開讀取","body":"下一步：在 GitHub Pages 選擇 GitHub Actions，執行發布並確認討論平台可公開讀取\n\n依據：[C-004](consensus.md#c-004-記錄與畫板的分工已確認)","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/tasks.md"},{"id":"T-005","title":"細化共用知識資料與情境介面","status":"待細化","summary":"依已確認的工作區方向，定義概念、來源、衍生教材與學習紀錄的關聯及回寫邊界，再以同一概念檢查跨介面操作","body":"下一步：依已確認的工作區方向，定義概念、來源、衍生教材與學習紀錄的關聯及回寫邊界，再以同一概念檢查跨介面操作\n\n依據：[C-008、C-009、C-011](consensus.md)","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/tasks.md"},{"id":"T-006","title":"釐清第一版範圍與自動化程度","status":"待討論","summary":"盤點候選功能的必要性、品質風險與驗證方式，再決定平台及分階段範圍","body":"下一步：盤點候選功能的必要性、品質風險與驗證方式，再決定平台及分階段範圍\n\n依據：[I-010](ideas.md#i-010-先接通學習循環再深化功能提案中)","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/tasks.md"}],"consensus":[{"id":"C-001","title":"專案目標","status":"已確認","summary":"使用者曾製作基於間隔重複（spaced repetition）的 Obsidian 閃卡外掛，現希望重構新的軟體，以更有效率、更深入地萃取知識，在有限時間內學習更多內容，並對考試成績有所幫助。","body":"使用者曾製作基於間隔重複（spaced repetition）的 Obsidian 閃卡外掛，現希望重構新的軟體，以更有效率、更深入地萃取知識，在有限時間內學習更多內容，並對考試成績有所幫助。\n\n三個設計概念：知識萃取、利用閃卡複習、加強記憶。記憶與考試表現的改善是預期目標，實際成效與驗證方式尚未確定。\n\n理由：使用者明確表達以上目標與設計概念。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-002","title":"軟體名稱","status":"已確認","summary":"正式英文名稱為 Essence Cards；儲存庫名稱為 Essence-Cards。Essence 呼應知識精華，Cards 呼應閃卡複習。","body":"正式英文名稱為 **Essence Cards**；儲存庫名稱為 `Essence-Cards`。Essence 呼應知識精華，Cards 呼應閃卡複習。\n\n中文名稱暫緩，之後再決定。\n\n理由：使用者已選定英文名稱，並明確要求延後中文命名。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-003","title":"討論方式","status":"已確認","summary":"每輪聚焦一個核心問題，允許自由延伸，由助理整理需求、取捨與未解問題。","body":"- 每輪聚焦一個核心問題，允許自由延伸，由助理整理需求、取捨與未解問題。\n- 使用者需求、助理提案、待驗證假設分開標示；沒有反對不等於已同意。\n- 以真實教材驗證抽象需求；研究依據與產品假設分開記錄。\n- 階段收尾時檢查遺漏、矛盾及範圍偏移。\n\n狀態標示使用已確認、提案中、待驗證、暫緩、已排除／已取代。\n\n理由：方便逐步取得共識，並在換對話或開始開發時延續工作。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-004","title":"記錄與畫板的分工","status":"已確認","summary":"index.html 是共同規劃 Essence Cards 的設計討論平台，用來討論如何做出知識學習工具。畫板上的卡片代表討論事項，不是學習閃卡；學習工具本身的功能、架構與操作介面另行討論。","body":"`index.html` 是共同規劃 Essence Cards 的設計討論平台，用來討論如何做出知識學習工具。畫板上的卡片代表討論事項，不是學習閃卡；學習工具本身的功能、架構與操作介面另行討論。\n\n- 討論過程另存為文件，保留想法與決策的演變。\n- 畫板分區呈現待釐清點子、目前任務及最新、仍有效的已確認共識；新點子的收錄不等於採用。\n- 討論紀錄、歷史提案、已排除選項與過期結論不呈現在畫板上。\n- 畫板採固定分區的無限畫板，可縮放、拖曳、點選卡片查看當前細節，並切換文字綱要。\n- Markdown 保存內容來源，HTML 與綱要依同一來源生成並保持同步。\n\n理由：使用者希望能回顧討論經過，同時讓畫板集中顯示當下需要掌握的事項。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-005","title":"GitHub 與公開範圍","status":"已確認","summary":"專案使用公開儲存庫：https://github.com/kuohappiness/Essence-Cards。","body":"專案使用公開儲存庫：\u003chttps://github.com/kuohappiness/Essence-Cards>。\n\n- 本 repo 保存共識、討論紀錄、任務、其他新增文件、HTML 畫板及後續程式碼。\n- 以 repo 中的最新內容作為共同維護依據，有實質結論時更新文件並提交版本。\n- API 金鑰、登入憑證及私人學習資料不屬於公開專案內容。\n\n理由：使用者建立並指定此 repo，已同意專案公開。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-006","title":"先收集點子，再逐項釐清","status":"已確認","summary":"使用者可隨時提出零散點子，由助理先記錄在看板的待釐清區，保留原意，之後再逐項討論，不必先整理成完整規格。","body":"使用者可隨時提出零散點子，由助理先記錄在看板的待釐清區，保留原意，之後再逐項討論，不必先整理成完整規格。\n\n參考軟體功能蒐集專區屬於設計討論平台的研究資料，初始閃卡參考包括 RemNote 與 Memory Toast。研究後是否採用其中的具體功能，另行討論；專區本身不列為未來學習工具的功能需求。\n\n理由：使用者希望先保存討論中的想法，避免打斷發想，也希望有地方累積同類軟體的參考。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-008","title":"共用知識基礎與學習回饋循環","status":"已確認","summary":"以概念筆記連接來源與學習材料，保存學習紀錄，依不同錯因補強並安排後續複習。","body":"摘要：以概念筆記連接來源與學習材料，保存學習紀錄，依不同錯因補強並安排後續複習。\n\n- 保留使用者手繪的「來源輸入 → 整理 → 筆記與比較表、互動教材、試題與閃卡 → 復盤、間隔重複與評分 → 回饋修訂」架構。\n- 概念筆記作為共用知識基礎；來源、相關概念、教材、題目與卡片保持關聯。直接匯入真題或卡片後，也可補上概念關聯。\n- 作答與評量後保存學習紀錄，支持後續判斷；本次評分、複習排程與主題復盤分工清楚。\n- 補強方式依錯因區分：忘記時調整複習、觀念混淆時補充筆記或教材、不會應用時做變式練習、題目有誤時修正題目與解析。\n- 回寫先提出可核對的修訂，再更新並保留版本；不把每次答錯一律當成概念筆記有誤。\n- 整理拆成內容選取、概念萃取、關係整理與材料製作；依需要選擇處理內容及產出，不要求每份來源都產生所有材料。\n\n理由：使用者提出手繪軟體架構；助理建議補上材料關聯、學習紀錄、分錯因回饋及可控整理，使用者明確表示同意並要求重繪。\n\n確認範圍：以上為架構方向；[重繪藍圖](diagrams/README.md)中的欄位、算法及自動化細節仍待討論。後續多情境介面方向見 C-011；三個主要入口、技術選型與第一版範圍仍待確認。\n\n討論摘要見[手繪架構整合與重繪](discussions/2026-10-06-architecture-redraw.md)。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-009","title":"以整體學習循環呈現架構","status":"已確認","summary":"以「輸入 → 整理 → 學習 → 回饋」為整體學習循環的主軸，取消固定流程數與步驟編號。","body":"摘要：以「輸入 → 整理 → 學習 → 回饋」為整體學習循環的主軸，取消固定流程數與步驟編號。\n\n來源、概念筆記、比較表、學習材料、練習、學習紀錄、補強修訂與復盤安排已整合在同一架構，後續討論聚焦功能、關聯及使用情境，不再以固定步驟數框定流程。\n\n- 輸入：取得與保存來源資料。\n- 整理：理解內容，建立概念筆記、關聯與比較表。\n- 學習：依需要使用教材、記憶卡或考題，作答、評量並留下紀錄。\n- 回饋：依學習紀錄補強、修訂與安排下一輪學習，可帶回整理或學習。\n\n功能名稱與資料關係保留；可依需要進入、分支與回到相關內容，不要求每次依序走完。這次調整的是呈現方式，具體功能、自動化程度、平台與第一版範圍仍待釐清。\n\n理由：使用者認為早期步驟已整合到整個大流程中，實際活動也不限於原分類，提出取消固定流程數的說法，接著明確要求將「輸入、整理、學習、回饋」加入藍圖作為學習循環。\n\n[目前架構藍圖](diagrams/README.md)取消步驟編號；[本次討論摘要](discussions/2026-10-06-integrated-learning-cycle.md)保存調整脈絡。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-010","title":"架構藍圖的繪製原則","status":"已確認","summary":"以美觀與清楚呈現軟體架構為優先，畫布尺寸與比例依內容調整，連線避免不必要的轉折。","body":"摘要：以美觀與清楚呈現軟體架構為優先，畫布尺寸與比例依內容調整，連線避免不必要的轉折。\n\n- 使用者沒有規定圖片尺寸或比例，版面依架構、文字量與閱讀需求安排。\n- 能直接連接的功能使用直線，透過位置與分組降低交叉及繞路。\n\n理由：使用者指出原圖中部分線條有不必要的轉彎，並明確表示美觀及呈現軟體架構比固定尺寸比例更重要。\n\n[本次重排摘要](discussions/2026-10-06-diagram-layout.md)記錄版面與連線調整；功能方向及第一版範圍未因繪圖改變。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"},{"id":"C-011","title":"多情境介面共用概念筆記","status":"已確認","summary":"以概念筆記為核心建立學習工作區；閱讀、整理理解、記憶練習與回顧依情境呈現不同介面，共用同一份知識來源，確認的修訂可回寫筆記。","body":"摘要：以概念筆記為核心建立學習工作區；閱讀、整理理解、記憶練習與回顧依情境呈現不同介面，共用同一份知識來源，確認的修訂可回寫筆記。\n\n- 主題作為使用入口，概念作為共用知識單位；同一概念可被不同主題引用，避免各介面或主題各自維護一份內容。\n- 同一工作區依任務呈現原始材料、可編輯筆記、比較表、概念關係、閃卡、題目、互動教材或學習回饋；切換時保留正在處理的概念、來源與位置。\n- 使用者可先收集、稍後整理，也可從已確認的部分開始學習；不必先填完所有欄位或每次走完整套循環。\n- 操作介面依當下任務顯示需要的內容與操作；學習回饋可直接連到相關概念、來源及下一個補強活動。\n- 在不同學習情境產生的概念修訂可回寫共用筆記；依 C-008 保留可核對的修訂與版本。\n- 筆記修改後提示可能受影響的題目與教材；涉及內容正確性的衍生修改由使用者確認。\n\n理由：使用者明確同意前一輪「以概念筆記為核心的學習工作區」開發方向，並以多種前端 UI 共用筆記資料來源、修訂可回寫筆記重述理解，要求往此方向開發。\n\n確認範圍：本次確立產品形式與資料共用原則。前端與資料層的分工不預先指定雲端服務；儲存技術、資料欄位、同步方式、具體版面、三個主要入口與第一版功能範圍仍待細化。現有 `index.html` 持續作為設計討論平台。\n\n[本次討論摘要](discussions/2026-10-06-shared-knowledge-workspace.md)記錄使用者確認與助理對回寫邊界的說明。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/consensus.md"}],"references":[{"id":"R-001","title":"RemNote","status":"待盤點","summary":"使用者指定的閃卡參考；已找到官方閃卡文件，詳細體驗與功能比較待研究。","body":"摘要：使用者指定的閃卡參考；已找到官方閃卡文件，詳細體驗與功能比較待研究。\n\n來源：使用者指定。\n\n- [官方網站](https://www.remnote.com/)\n- [官方閃卡文件](https://help.remnote.com/en/collections/3370931-flashcards)\n- [Flashcard Basics](https://help.remnote.com/en/articles/8663109-flashcard-basics)\n\n查核紀錄：2026-10-06 已找到官方文件。尚未實際操作或完成系統性功能盤點。\n\n研究問題（助理提案）：從閱讀／筆記到製卡的操作如何銜接？複習時如何回到原始脈絡？\n\n功能觀察、優缺點與 Essence Cards 可借鑑之處：待研究。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/references/software.md"},{"id":"R-002","title":"Memory Toast","status":"待查核","summary":"使用者指定的閃卡參考；先保存網址，功能與使用體驗待查核。","body":"摘要：使用者指定的閃卡參考；先保存網址，功能與使用體驗待查核。\n\n來源：使用者指定。\n\n- [官方網站（使用者提供）](https://www.memory-toast.com/zh-TW)\n\n查核紀錄：2026-10-06 本次未能讀取頁面，無法據此確認功能；這不代表網站無法正常使用。\n\n研究問題（助理提案）：如何建立與整理卡片？複習流程和回饋如何呈現？\n\n功能觀察、優缺點與 Essence Cards 可借鑑之處：待研究。","source":"https://github.com/kuohappiness/Essence-Cards/blob/main/docs/references/software.md"}]}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('board-data').textContent);
const stage=document.getElementById('stage'), board=document.getElementById('board'), dialog=document.getElementById('detail-dialog');
const groups=[['ideas','待釐清點子','先留下原意，之後逐項討論'],['tasks','目前任務','掌握進度與下一步'],['consensus','最新共識','已確認、目前有效的方向']];
let view='board', x=0, y=0, scale=1, drag=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeURL(raw,source){try{let url=new URL(raw,source);return ['https:','http:'].includes(url.protocol)?url.href:null}catch{return null}}
function inline(text,source){
 let out='', end=0;const pattern=/\[([^\]]+)\]\(([^\s)]+)\)|<(https?:\/\/[^>]+)>|\*\*([^*]+)\*\*|`([^`]+)`/g;let m;
 while((m=pattern.exec(text))){out+=esc(text.slice(end,m.index));if(m[1]||m[3]){const href=safeURL(m[2]||m[3],source);out+=href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(m[1]||m[3])}</a>`:esc(m[1]||m[3]);}else if(m[4])out+=`<strong>${esc(m[4])}</strong>`;else out+=`<code>${esc(m[5])}</code>`;end=pattern.lastIndex;}return out+esc(text.slice(end));
}
function markdown(text,source){return text.split(/\n\s*\n/).map(block=>{const lines=block.split('\n');if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>'<li>'+inline(l.slice(2),source)+'</li>').join('')+'</ul>';if(lines.every(l=>l.startsWith('> ')))return '<blockquote>'+inline(lines.map(l=>l.slice(2)).join('\n'),source)+'</blockquote>';return '<p>'+lines.map(l=>inline(l,source)).join('<br>')+'</p>';}).join('')}
function cardHTML(card,full=false){return `<div class="card-top"><span class="ident">${esc(card.id)}</span><span class="badge">${esc(card.status)}</span></div><h3>${esc(card.title)}</h3>`+(full?`<div class="detail">${markdown(card.body,card.source)}</div><a class="source" href="${esc(card.source)}" target="_blank" rel="noopener noreferrer">查看來源文件 ↗</a>`:`<p class="summary">${esc(card.summary)}</p><div class="card-foot"><span>查看細節</span><span aria-hidden="true">↗</span></div>`)}
function openCard(card){document.getElementById('detail-id').textContent=card.id+' / '+card.status;document.getElementById('detail-title').textContent=card.title;document.getElementById('detail-body').innerHTML=markdown(card.body,card.source);document.getElementById('detail-source').href=card.source;dialog.showModal()}
function render(){
 board.replaceChildren();board.className=view==='references'?'reference-grid':'board';stage.className='stage'+(view==='canvas'?' canvas':view==='outline'?' outline':'');board.style.transform='';document.querySelector('.reference-intro')?.remove();
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.getElementById('zoom').hidden=view!=='canvas';document.getElementById('hint').hidden=view==='canvas';document.getElementById('hint').textContent=view==='references'?'參考收錄 ≠ 決定採用':'點開卡片，查看原意與下一步';
 if(view==='references'){
  const intro=document.createElement('p');intro.className='reference-intro';intro.textContent='設計討論的研究資料：先比較其他軟體的閃卡功能與使用體驗，再討論可借鑑之處。每項參考保留來源與查核狀態。';stage.prepend(intro);
  data.references.forEach(card=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="card-top"><span class="ident">${esc(card.id)}</span><span class="badge">${esc(card.status)}</span></div><h2>${esc(card.title)}</h2><div class="detail">${markdown(card.body,card.source)}</div>`;board.append(el)});
 }else groups.forEach(([key,title,note])=>{const lane=document.createElement('section');lane.className='lane '+key;lane.innerHTML=`<div class="lanehead"><span class="dot" aria-hidden="true"></span><h2>${title}</h2><span class="count">${data[key].length}</span></div><p class="lane-description">${note}</p><div class="cards"></div>`;const holder=lane.querySelector('.cards');data[key].forEach(card=>{const el=document.createElement(view==='outline'?'article':'button');el.className='card';el.dataset.id=card.id;el.innerHTML=cardHTML(card,view==='outline');if(view!=='outline')el.addEventListener('click',()=>openCard(card));holder.append(el)});if(!data[key].length)holder.innerHTML='<p class="empty">目前沒有項目</p>';board.append(lane)});
 if(view==='canvas')requestAnimationFrame(fit);
}
function transform(){board.style.transform=`translate(${x}px,${y}px) scale(${scale})`;document.getElementById('scale').value=Math.round(scale*100)+'%'}
function fit(){if(view!=='canvas')return;scale=Math.min(1,(stage.clientWidth-30)/board.offsetWidth,(stage.clientHeight-30)/board.offsetHeight);scale=Math.max(.12,scale);x=(stage.clientWidth-board.offsetWidth*scale)/2;y=15;transform()}
function zoomAt(factor,cx=stage.clientWidth/2,cy=stage.clientHeight/2){const next=Math.max(.12,Math.min(2,scale*factor));x=cx-(cx-x)*next/scale;y=cy-(cy-y)*next/scale;scale=next;transform()}
document.getElementById('meta').textContent='共識 v'+data.version+' · '+data.updated;
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));
document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.getElementById('zoom-in').addEventListener('click',()=>zoomAt(1.2));document.getElementById('zoom-out').addEventListener('click',()=>zoomAt(1/1.2));document.getElementById('fit').addEventListener('click',fit);
stage.addEventListener('wheel',e=>{if(view!=='canvas')return;e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
stage.addEventListener('pointerdown',e=>{if(view!=='canvas'||e.target.closest('button,a')||e.button!==0)return;drag={id:e.pointerId,px:e.clientX,py:e.clientY,x,y};stage.setPointerCapture(e.pointerId);stage.classList.add('dragging')});
stage.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;x=drag.x+e.clientX-drag.px;y=drag.y+e.clientY-drag.py;transform()});
for(const event of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(event,()=>{drag=null;stage.classList.remove('dragging')});
window.addEventListener('resize',()=>{if(view==='canvas')fit()});render();
</script>
</body>
</html>
