<title>複習畫面的燈泡與喇叭</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：說明在上，四個 375 寬的 iPhone 畫面並排（窄時一欄）。顏色照 src/ui/tokens.css；畫面本身固定淺色或深色，不跟頁面主題 */
:root {
  --bg: #F1F1EE; --fg: #1D1F23; --sub: #5E636B; --frame: #D8D8D3;
  --ui: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1A1B1D; --fg: #E6E7E9; --sub: #A0A5AD; --frame: #34363A; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #1A1B1D; --fg: #E6E7E9; --sub: #A0A5AD; --frame: #34363A; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--ui); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
.intro { max-width: 68ch; }
.intro h1 { font-size: 22px; margin: 0 0 8px; text-wrap: balance; }
.intro p, .intro li { color: var(--sub); }
.intro ul { padding-left: 1.2em; margin: 6px 0 0; }
.grid { display: flex; flex-wrap: wrap; gap: 28px 24px; margin-top: 28px; }
figure { margin: 0; width: 375px; max-width: 100%; }
figcaption { font-size: 14px; color: var(--sub); margin-bottom: 8px; min-height: 2.8em; }
figcaption b { color: var(--fg); }

/* 一個 iPhone 畫面：照 Review.css 的 .ec-app */
.ec-app { --ec-page: #FAFAF9; --ec-ink: #1D1F23; --ec-muted: #6A6F77; --ec-line: #E5E5E2; --ec-press: #ECEFF4; --ec-key: #7A5BC7; --ec-good: #17693A;
  --ec-faint: color-mix(in srgb, var(--ec-muted) 62%, var(--ec-page));
  height: 640px; border: 1px solid var(--frame); border-radius: 28px; overflow: hidden; background: var(--ec-page); color: var(--ec-ink); font: 15px/1.5 var(--ui); display: flex; flex-direction: column; }
.ec-app.dark { --ec-page: #121314; --ec-ink: #E6E7E9; --ec-muted: #959AA2; --ec-line: #2A2C30; --ec-press: #263043; --ec-key: #B69CF5; --ec-good: #68D398; }
.ec-app button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
.ico { width: 44px; height: 44px; display: inline-grid; place-items: center; color: var(--ec-muted); border-radius: 12px; }
.ec-top { display: grid; grid-template-columns: 44px 1fr auto auto 44px; align-items: center; padding: 30px 10px 0; }
.ec-count { text-align: center; font-size: 14px; color: var(--ec-muted); }
/* 自動朗讀：開著是一般文字的顏色，關著變灰 */
.ec-auto { cursor: pointer; }
.ec-auto[aria-checked="true"] { color: var(--ec-ink); }
.ec-auto[aria-checked="false"] { color: var(--ec-muted); opacity: .75; }
.ec-prog { height: 2px; margin-top: 6px; background: var(--ec-line); }
.ec-prog i { display: block; height: 100%; width: 38%; background: var(--ec-muted); }
.ec-stage { flex: 1; padding: 30px 26px 16px; overflow: hidden; }
.ec-meta { font-size: 13px; color: var(--ec-muted); }
.ec-q { margin-top: 18px; font-size: 24px; line-height: 1.8; font-weight: 500; }
.ec-line { border-bottom: 2px solid var(--ec-ink); padding: 0 4px; color: var(--ec-key); }
.say { display: inline-grid; place-items: center; width: 38px; height: 38px; vertical-align: middle; margin: -10px 0 -8px 2px; color: var(--ec-muted); }
.ec-answer { margin-top: 48px; font-size: 19px; }
.ec-spell { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.ok { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--ec-press); }
.word { font-weight: 500; letter-spacing: .03em; }
.ec-a { line-height: 1.75; }
.ec-ex { margin-top: 20px; font-size: 16px; line-height: 1.6; color: var(--ec-muted); }
.ec-ex-item + .ec-ex-item { margin-top: 10px; }
.ec-ex-label { font-size: 13px; }
/* 記憶錨點：燈泡接在內容前面，其他行和內容對齊 */
.ec-ex-item.is-anchor { display: flex; gap: 6px; }
.ec-bulb { flex: none; height: 1.6em; display: grid; place-items: center; color: var(--ec-faint); }
.ec-ex-body { min-width: 0; }
.note { font-size: 12px; color: var(--sub); margin-top: 8px; }
</style>
