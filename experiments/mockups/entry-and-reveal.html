<title>Essence Cards 入口與顯示答案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
/* Layout: a slim mockup bar (screen, theme, language, variant), then the plugin at phone size: full screen on phones, framed on desktop. Tokens follow the quiet review style (D-070). */
:root {
  --mk-bg: #E6E7EA; --mk-fg: #1B1D21; --mk-muted: #636872; --mk-line: #CBCED5; --mk-sel: #1B1D21; --mk-sel-fg: #FFFFFF; --mk-frame: #1B1D21;
  /* 記憶配色（D-060、D-062）：沒印象紅、差一點橙、記住了綠、太簡單藍；新卡灰（D-069） */
  --ec-miss: #B3261E; --ec-near: #8F4C00; --ec-good: #17693A; --ec-easy: #2862B9; --ec-new: #575C64;
  /* 安靜樣式（D-070）：沒有卡片外框，只靠字和留白；顏色只用在自評的圓點和要想起來的重點 */
  --page: #FAFAF9; --ink: #1D1F23; --muted: #6A6F77; --line: #E5E5E2; --press: #ECEFF4; --key: #7A5BC7;
  --done: #3F6B52; /* 做完今天的份：沉穩的灰綠，和記憶配色的「記得」同一個方向 */
  --gl: env(safe-area-inset-left, 0px); --gr: env(safe-area-inset-right, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --mk-bg: #0E0F11; --mk-fg: #E8E9EC; --mk-muted: #969BA4; --mk-line: #2D3036; --mk-sel: #E8E9EC; --mk-sel-fg: #111214; --mk-frame: #2A2D33;
    --ec-miss: #FF8A80; --ec-near: #FFB25E; --ec-good: #68D398; --ec-easy: #8DB7FF; --ec-new: #A0A5AD;
    --page: #121314; --ink: #E6E7E9; --muted: #959AA2; --line: #2A2C30; --press: #263043; --key: #B69CF5; --done: #8DBFA2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --mk-bg: #0E0F11; --mk-fg: #E8E9EC; --mk-muted: #969BA4; --mk-line: #2D3036; --mk-sel: #E8E9EC; --mk-sel-fg: #111214; --mk-frame: #2A2D33;
  --ec-miss: #FF8A80; --ec-near: #FFB25E; --ec-good: #68D398; --ec-easy: #8DB7FF; --ec-new: #A0A5AD;
  --page: #121314; --ink: #E6E7E9; --muted: #959AA2; --line: #2A2C30; --press: #263043; --key: #B69CF5; --done: #8DBFA2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--mk-bg); color: var(--mk-fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--mk-fg); outline-offset: -2px; }
.ec-app :focus-visible { outline-color: var(--ink); }

/* 樣式稿的控制列 */
.mk { height: 100%; display: flex; flex-direction: column; }
.mk-bar { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 8px; padding-left: max(16px, var(--gl)); padding-right: max(16px, var(--gr)); }
.mk-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; }
.mk-title { display: none; margin-right: 6px; font-weight: 600; }
.mk-lab { font-size: 12px; color: var(--mk-muted); }
.mk-hint { margin: 0; max-width: 36em; min-height: 2.9em; text-align: center; font-size: 12px; line-height: 1.45; color: var(--mk-muted); text-wrap: pretty; }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--mk-line); border-radius: 999px; }
.seg button { border: 0; background: none; color: var(--mk-muted); font-size: 13px; line-height: 1; padding: 7px 10px; border-radius: 999px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--mk-sel); color: var(--mk-sel-fg); }
.mk-fold { width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 1px solid var(--mk-line); border-radius: 50%; background: none; color: var(--mk-muted); }
.mk-unfold { display: none; align-self: center; border: 0; background: none; color: var(--mk-muted); font-size: 12px; padding: 4px 14px; }
.mk.is-folded .mk-bar { display: none; }
.mk.is-folded .mk-unfold { display: block; }
.mk-stage { flex: 1; min-height: 0; display: flex; justify-content: center; }

/* 外掛畫面 */
.ec-app { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--page); color: var(--ink); }
@media (min-width: 640px) {
  .mk-bar { padding-block: 16px 12px; }
  .mk-title { display: inline; }
  .mk-stage { padding: 0 16px 24px; }
  .ec-app { width: 390px; max-width: 100%; height: min(820px, 100%); border: 10px solid var(--mk-frame); border-radius: 46px; }
}
.scr, .rv, .en { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ec-ico { flex: none; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 12px; background: none; color: var(--muted); }
.ec-ico:disabled { opacity: .3; }
.ec-ico:not(:disabled):active { background: var(--press); }
.ec-ico.sm { width: 40px; height: 40px; }

/* 複習畫面 */
.ec-top { flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 6px max(10px, var(--gr)) 0 max(10px, var(--gl)); }
.ec-count { text-align: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ec-return { justify-self: center; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 4px 0 10px; border: 0; background: none; color: var(--ink); font-size: 14px; font-weight: 500; }
.ec-prog { flex: none; height: 2px; margin-top: 6px; background: var(--line); }
.ec-prog i { display: block; height: 100%; background: var(--muted); transition: width .35s ease; }

.ec-stage { flex: 1; min-height: 0; overflow-y: auto; padding: 30px max(26px, var(--gr)) 16px max(26px, var(--gl)); }
.rv.can-tap .ec-stage { cursor: pointer; }
.ec-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.ec-new { padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--ec-new) 16%, var(--page)); color: var(--ec-new); font-size: 12px; font-weight: 600; }
.ec-q { margin-top: 18px; font-size: 24px; line-height: 1.55; font-weight: 500; text-wrap: pretty; }
/* 填空：一條和題目文字同色的底線；翻面後答案浮現在同一條線上，線變成紫色 */
.ec-blank { display: inline-block; width: 4em; height: 1em; margin: 0 .15em; vertical-align: -.32em; border-bottom: 2px solid var(--ink); }
/* 霧化的空格：C1 是真的答案，C2 是同樣字數的假字加上字數 */
.ec-blank.is-fog { position: relative; width: auto; height: 1.32em; padding: 0 .2em; overflow: hidden; vertical-align: -.26em; line-height: 1.32em; background: color-mix(in srgb, var(--line) 70%, transparent); }
.ec-fog-t { display: inline-block; filter: blur(5px); opacity: .75; font-weight: 600; user-select: none; -webkit-user-select: none; }
.v-C2 .ec-fog-t { opacity: .38; }
.ec-cnt { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 600; line-height: 1; color: var(--ink); white-space: nowrap; }
/* 要想起來的東西：粗體加一條細的紫色底線（D-068、D-070）；紫色不屬於記憶配色 */
.ec-a strong, .ec-fill, .ec-mk { background: none; color: inherit; font-weight: 700; text-decoration-line: underline; text-decoration-color: var(--key); text-decoration-thickness: 2px; text-underline-offset: .32em; text-decoration-skip-ink: none; }
.ec-mk { color: var(--key); }
.ec-ans { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); }
.ec-ans.bare { margin-top: 6px; padding-top: 0; border-top: 0; }
.ec-a { font-size: 19px; line-height: 1.75; }
.ec-a p { margin: 0 0 8px; }
.ec-ex { font-size: 16px; line-height: 1.6; color: var(--muted); }
/* 詳解和答案分開：拉開距離，中間一條短細線，像書頁註解上方的線 */
.ec-a p + .ec-ex { position: relative; margin-top: 20px; padding-top: 16px; }
.ec-a p + .ec-ex::before { content: ""; position: absolute; top: 0; left: 0; width: 24px; border-top: 1px solid color-mix(in srgb, var(--muted) 55%, transparent); }

/* 答案的位置先留好（B、C1、C2），眼睛圖示放在中間；觸控範圍是整個畫面 */
.ec-stack { display: grid; }
.ec-stack > * { grid-area: 1 / 1; min-width: 0; }
.slot:not(.is-open) .ec-stack { min-height: 96px; }
.slot.bare .ec-stack { margin-top: 20px; }
.slot.bare:not(.is-open) .ec-stack { min-height: 72px; }
.slot:not(.is-open) .ec-a.real { visibility: hidden; }
.ec-fog { align-self: start; filter: blur(5.5px); opacity: .6; user-select: none; -webkit-user-select: none; pointer-events: none; }
.ec-eye-wrap { place-self: center; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.ec-eye { pointer-events: auto; width: 56px; height: 56px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--page); color: var(--ink); box-shadow: 0 1px 3px color-mix(in srgb, var(--ink) 10%, transparent); }
.ec-eye:active { background: var(--press); }
.ec-eye-cap { padding: 1px 8px; border-radius: 6px; background: var(--page); color: var(--muted); font-size: 12px; font-weight: 600; }
.out, .out * { pointer-events: none !important; }

/* 出處與朗讀：同一套細線圖示（D-079、D-082） */
.ec-tools { display: flex; align-items: center; margin: 8px 0 0 -10px; }
.ec-srcw { display: inline-flex; align-items: center; gap: 2px; }
.ec-tip { display: none; align-items: center; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--press); color: var(--ink); font-size: 13px; }
.ec-srcw.is-tip .ec-tip { display: inline-flex; }
@media (hover: hover) { .ec-srcw:hover .ec-tip { display: inline-flex; } }
.ec-say { display: inline-grid; place-items: center; width: 38px; height: 38px; margin: -8px -8px -8px 0; padding: 0; vertical-align: middle; border: 0; border-radius: 10px; background: none; color: var(--muted); }
.ec-say:active { background: var(--press); }

/* 中→英打字（D-066） */
.ec-inrow { display: flex; align-items: center; gap: 8px; margin-top: 24px; border-bottom: 2px solid var(--line); }
.ec-inrow:focus-within { border-bottom-color: var(--ink); }
.ec-input { flex: 1; min-width: 0; padding: 8px 2px; border: 0; border-radius: 0; background: transparent; color: var(--ink); font-family: inherit; font-size: 24px; font-weight: 500; }
.ec-input:focus { outline: none; }
.ec-input::placeholder { color: var(--muted); font-size: 17px; font-weight: 400; }
.ec-inbtn { flex: none; width: 44px; height: 44px; display: grid; place-items: center; margin-right: -6px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--muted); }
.ec-inbtn.is-check { width: 40px; height: 40px; margin: 2px -2px 2px 0; background: var(--ink); color: var(--page); }
.ec-spell { display: grid; gap: 8px; }
.ec-spell .row { display: flex; align-items: center; gap: 12px; }
.ec-spell .lab { flex: none; min-width: 4.5em; font-size: 13px; color: var(--muted); }
.ec-spell .w { min-width: 0; font-size: 24px; font-weight: 500; letter-spacing: .03em; overflow-wrap: anywhere; }
.ec-spell s { color: var(--muted); text-decoration-thickness: 2px; }
.ec-ok { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--press); color: var(--ink); }

/* 自評四鍵（D-062、D-070）：不顯示間隔 */
.ec-actions { flex: none; border-top: 1px solid var(--line); padding-left: var(--gl); padding-right: var(--gr); }
.ec-actions.is-blank { height: 64px; border-top-color: transparent; }
.ec-show { width: 100%; height: 64px; border: 0; background: none; color: var(--ink); font-size: 17px; font-weight: 500; }
.ec-rates { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.ec-rate { height: 64px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 4px; border: 0; background: none; color: var(--ink); font-size: 16px; font-weight: 600; white-space: nowrap; }
.ec-app[lang="en"] .ec-rate { font-size: 15px; gap: 6px; }
.ec-rate + .ec-rate { border-left: 1px solid var(--line); }
.ec-rate::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--k); }
.ec-rate:active, .ec-show:active { background: var(--press); }
.ec-rate[aria-pressed="true"] { background: var(--press); }
.ec-rate[aria-pressed="true"]::before { box-shadow: 0 0 0 3px color-mix(in srgb, var(--k) 30%, transparent); }
[data-k="miss"] { --k: var(--ec-miss); }
[data-k="near"] { --k: var(--ec-near); }
[data-k="good"] { --k: var(--ec-good); }
[data-k="easy"] { --k: var(--ec-easy); }

.ec-done { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 56px 8px 0; text-align: center; }
.ec-done-mark { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; background: var(--press); color: var(--ink); }
.ec-done h2 { margin: 14px 0 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
.ec-done-sub { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.ec-done .en-start { width: auto; min-width: 200px; height: 50px; margin-top: 22px; font-size: 16px; }

/* 翻面：只做透明度淡入淡出，不做模糊半徑的動畫 */
@keyframes fin { from { opacity: 0; } to { opacity: 1; } }
@keyframes fout { from { opacity: var(--o, 1); } to { opacity: 0; } }
.just .ec-ans:not(.slot), .just .slot .ec-a.real, .just .ec-tools, .just .ec-fill, .just .ec-rates, .just .ec-say { animation: fin .18s ease-out both; }
.just .ec-fog.out { --o: .6; animation: fout .18s ease-in both; }
.just .ec-eye-wrap.out { animation: fout .12s ease-in both; }

/* 入口、目錄、考試範圍 */
.en-top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 50px; padding: 6px max(10px, var(--gr)) 0 max(26px, var(--gl)); }
.en-top.nav { display: grid; grid-template-columns: 76px 1fr 76px; padding-left: max(10px, var(--gl)); }
.en-title { margin: 0; font-size: 17px; font-weight: 600; text-align: center; }
.en-h1 { margin: 0; font-size: 22px; font-weight: 600; }
.en-tbtn { justify-self: end; min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: none; color: var(--ink); font-size: 15px; font-weight: 500; white-space: nowrap; }
.en-tbtn:active { background: var(--press); }
.en-date { margin: 0; font-size: 13px; color: var(--muted); }
.en-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 max(26px, var(--gr)) 24px max(26px, var(--gl)); }
.en-start { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; padding: 0 20px; border: 1px solid var(--ink); border-radius: 16px; background: var(--ink); color: var(--page); font-size: 18px; font-weight: 600; letter-spacing: .04em; }
.en-start:active { opacity: .86; }
.en-start.is-soft { border-color: var(--line); background: none; color: var(--ink); }
.en-dock { flex: none; padding: 12px max(20px, var(--gr)) 16px max(20px, var(--gl)); border-top: 1px solid var(--line); }
.en-filter { margin: 12px 0 0; font-size: 12px; color: var(--muted); }
.en-today { margin: 0; }
.en-today .sb-name { font-size: 22px; }
/* 入口右下角的字標：細的斜體襯線字，只放在入口 */
.en-mark { flex: none; margin: 0; padding: 6px max(22px, var(--gr)) 14px 0; text-align: right; font: italic 500 15px/1 "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: .06em; color: var(--muted); }
.is-done .sb-n { color: var(--done); font-weight: 600; }

/* 入口：一科一列，按鈕是 ▶ 加上還要花的時間；做完的樣子 A 是分隔線填滿，B 是按鈕外圈填滿 */
.sb-list { margin-top: 14px; border-top: 1px solid var(--line); }
.sb { position: relative; display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.sb-A .sb { border-bottom-color: transparent; }
.sb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sb-l1 { display: flex; align-items: baseline; gap: 10px; }
.sb-name { font-size: 18px; font-weight: 600; }
.sb-n { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sb-ex { font-size: 13px; color: var(--muted); }
.sb-ex b, .tr-ex b { margin: 0 2px; color: var(--ink); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sb.is-done .sb-bar i { background: var(--done); }
.sb-bar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--line); }
.sb-bar i { display: block; height: 100%; background: var(--ink); }
.sb-btn { position: relative; flex: none; width: 108px; height: 40px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 20px; background: none; color: var(--ink); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sb-btn.sm { width: 96px; height: 36px; font-size: 14px; }
.sb-btn:not(:disabled):active { background: color-mix(in srgb, var(--press) 45%, transparent); }
.sb-btn:disabled { border-color: transparent; color: var(--muted); font-weight: 500; }
.sb-lbl { position: relative; display: inline-flex; align-items: center; gap: 6px; }
.sb-B .sb-btn:not(.sm) { border-color: transparent; }
.sb-B .sb-btn:disabled { color: var(--muted); }
.sb-ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.sb-ring rect { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
.sb-ring .tk { stroke: var(--line); }
.sb-ring .pg { stroke: var(--ink); }
.sb-more { margin-top: 18px; height: 50px; font-size: 16px; }
.sc-row { align-items: flex-start; }
.sc-row > svg { margin-top: 3px; }
.sc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sc-lines { display: grid; gap: 2px; margin-top: 6px; padding-left: 14px; }
.sc-line { display: grid; grid-template-columns: 3.6em 1fr; gap: 8px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sc-line b { font-weight: 500; color: var(--ink); }
.tr-ex { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }

.en-row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px max(16px, var(--gr)) 10px max(26px, var(--gl)); border: 0; background: none; color: var(--ink); font-size: 16px; text-align: left; }
.en-row.in { padding-left: 0; padding-right: 0; }
.en-row + .en-row { border-top: 1px solid var(--line); }
.en-row:not(:disabled):active { background: var(--press); }
.en-row-t { flex: none; }
.en-row-v { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-end; text-align: right; color: var(--muted); font-size: 14px; line-height: 1.4; font-variant-numeric: tabular-nums; }
.en-row-v small { font-size: 12px; }
.en-row > svg { flex: none; color: var(--muted); }

/* 入口 1：一個大按鈕 */
.en1-main { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 0 max(28px, var(--gr)) 16px max(28px, var(--gl)); }
.en1-in { margin-block: auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
.en-big { margin: 8px 0 0; font-size: 36px; line-height: 1.15; font-weight: 600; font-variant-numeric: tabular-nums; text-wrap: balance; }
.en-sub { margin: 8px 0 0; font-size: 16px; color: var(--muted); }
.en1-main .en-start { max-width: 320px; margin-top: 30px; }
.en-subjs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
.en-subj { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--ink); font-size: 15px; }
.en-subj b { font-weight: 600; font-variant-numeric: tabular-nums; }
.en-subj:disabled { color: var(--muted); }
.en-subj:not(:disabled):active { background: var(--press); }
.en-links { flex: none; border-top: 1px solid var(--line); padding-bottom: 6px; }

/* 入口 2：分科清單，開始按鈕在底部 */

    if (done) {
      const d = doneInfo();
      body = `<div class="ec-done"><div class="ec-done-mark">${ICON.check(30)}</div><h2>${d.h}</h2><p class="ec-done-sub">${d.sub}</p>${d.btn}</div>`;
      acts = `<button type="button" class="ec-show" data-act="home">${S.from === 'dir' ? t().dir : t().home}</button>`;
    } else {
      const h = viewing ? S.hist[S.view] : null, c = S.deck[viewing ? h.idx : S.i];
      const revealed = viewing || S.revealed, sp = viewing ? h.spell : S.spell;
      body = cardHTML(c, revealed, sp);
      canTap = !revealed && !c.spell;
      if (!revealed) {
        acts = S.rv === 'A' ? `<button type="button" class="ec-show" data-act="show" id="show-btn">${c.spell && S.typed.trim() ? t().check : t().show}</button>` : '';
        if (!acts && !c.spell) blankAct = ' data-act="show"';
      } else {
        acts = '<div class="ec-rates">' + allowedFor(sp).map(k => `<button type="button" class="ec-rate" data-act="rate" data-k="${k}"${viewing ? ` aria-pressed="${h.k === k}"` : ''}>${t().rates[k]}</button>`).join('') + '</div>';
      }
    }
    return `<div class="rv v-${S.rv}${S.just ? ' just' : ''}${canTap ? ' can-tap' : ''}">${top}<div class="ec-stage" data-scroll="stage">${body}</div>`
      + `<div class="ec-actions${acts ? '' : ' is-blank'}"${blankAct}>${acts}</div></div>`;
  }
  function doneInfo() {
    const m = Math.floor((Date.now() - S.t0) / 60000);
    const btn = (act, label, extra = '', soft = false) => `<button type="button" class="en-start${soft ? ' is-soft' : ''}" data-act="${act}"${extra}>${label}</button>`;
    if (S.mode === 'utoday') return { h: t().uDone, sub: t().took(S.reviewed, m), btn: '' };
    if (S.mode === 'prac') return { h: t().pracDone, sub: t().took(S.reviewed, m), btn: btn('prac-again', t().pracAgain, '', true) };
    const rest = ORDER.filter(id => !S.done[id]);
    if (S.mode === 'today' && S.subj && rest.length) {
      const s = subjById(rest[0]);
      return { h: t().doneSubj(nm(subjById(S.subj))), sub: t().restLeft(nm(s), TODAY[s.id] - S.cnt[s.id]), btn: btn('subj', t().next(nm(s)), ` data-s="${s.id}"`) };
    }
    return { h: S.mode === 'more' ? t().moreDone : t().doneAll, sub: t().took(S.reviewed, m), btn: btn('more', t().more, '', true) };
  }

  function startReview({ subj = null, unit = null, mode = 'today', cards = null } = {}) {
    let deck;
    if (cards) deck = cards;
    else if (mode === 'today') {
      const rest = subj ? [subj] : ORDER.filter(id => !S.done[id]);
      if (!rest.length) return startReview({ mode: 'more' });
      deck = CARDS.filter(c => rest.includes(c.subj));
    } else deck = CARDS.slice();
    if (unit && !cards) deck = CARDS.filter(c => c.unit === unit);
    S.unit = unit; S.udue = unit ? dueOf(unitById(unit)) : 0;
    if (!deck.length) { deck = CARDS.slice(); toast(t().onlyDemo); }
    if (S.screen !== 'review') S.from = S.screen === 'dir' ? 'dir' : 'entry';
    Object.assign(S, { screen: 'review', deck, i: 0, mode, subj, revealed: false, spell: null, typed: '', hist: [], view: null, busy: false, t0: Date.now() });
    render();
  }
  function reveal() {
    if (S.busy || S.revealed || S.view != null || S.screen !== 'review' || S.i >= S.deck.length) return;
    const c = S.deck[S.i];
    if (c.spell) {
      const typed = S.typed.trim().toLowerCase(), word = c.spell.toLowerCase();
      S.spell = { ok: typed === word, ...diff(typed, word) };
    }
    S.revealed = true; S.revealedAt = performance.now(); S.just = true;
    render(); S.just = false;
  }
  async function rate(k) {
    if (S.view != null) {
      const h = S.hist[S.view];
      if (allowedFor(h.spell).includes(k)) { h.k = k; render(); } // 回看時直接改評分（D-084）
      return;
    }
    // 翻面後 0.3 秒內的點擊不算，避免連點「顯示答案」時誤按自評
    if (S.busy || !S.revealed || performance.now() - S.revealedAt < 300 || !allowedFor(S.spell).includes(k)) return;
    S.busy = true;
    S.hist.push({ idx: S.i, k, spell: S.spell });
    await anim(scr.querySelector('.ec-card'), [{ opacity: 1 }, { opacity: 0 }], { duration: 110, easing: 'ease-in', fill: 'forwards' });
    S.i++; S.reviewed++; S.revealed = false; S.spell = null; S.typed = '';
    if (S.i >= S.deck.length && S.mode === 'utoday') { const u = unitById(S.unit); S.udone.add(u.id); S.cnt[u.subj] = Math.min(TODAY[u.subj], S.cnt[u.subj] + S.udue); }
    if (S.i >= S.deck.length && S.mode === 'today') (S.subj ? [S.subj] : ORDER).forEach(id => { S.done[id] = true; S.cnt[id] = TODAY[id]; });
    if (S.i >= S.deck.length && S.mode === 'check') { S.checkDone = true; S.checkCnt = CHECK_N; S.screen = 'checkres'; }
    render();
    await anim(scr.querySelector('.ec-card, .ec-done'), [{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: 'ease-out' });
    S.busy = false;
  }
  function back() { if (S.screen !== 'review' || !S.hist.length || S.view === 0) return; S.view = S.view == null ? S.hist.length - 1 : S.view - 1; render(); }
  function fwd() { if (S.screen !== 'review' || S.view == null) return; S.view = S.view < S.hist.length - 1 ? S.view + 1 : null; render(); }
  function say(text) {
    try { const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); }
    catch (e) { toast(t().noSpeech); }
  }

  /* ---------- 入口 ---------- */
  const restCount = () => ORDER.reduce((n, id) => n + TODAY[id] - S.cnt[id], 0);
  const anyDone = () => ORDER.some(id => S.done[id]);
  const settingsBtn = () => `<button type="button" class="ec-ico" data-act="settings" aria-label="${t().settings}">${ICON.sliders}</button>`;
  const subjInScope = id => !!S.scope && UNITS.some(u => u.subj === id && S.scope.units.has(u.id));
  const examDate = id => subjInScope(id) ? S.scope.start || '' : '';
  // 倒數算到考試開始那天；考試期間內顯示「今天考試」
  const examText = (d, full) => {
    const n = daysLeft(d);
    if (n <= 0) return t().examToday;
    const per = S.scope.end && S.scope.end !== S.scope.start ? `${md(S.scope.start)}～${md(S.scope.end)}` : md(S.scope.start);
    return full ? t().examFull(per, n) : t().examLeft(n);
  };
  function scopeRow(inset) {
    const sc = S.scope;
    const lines = sc ? SUBJ.filter(s => s.id !== 'ext').map(s => {
      const us = UNITS.filter(u => u.subj === s.id && sc.units.has(u.id));
      return us.length ? `<span class="sc-line"><b>${nm(s)}</b><span>${us.map(u => u.short).join(t().sep)}</span></span>` : '';
    }).join('') : '';

      + `${lines ? '' : `<span class="en-row-v">${t().scopeNone}</span>`}${ICON.chevR}</button>`;
  }
  const dirRow = inset => `<button type="button" class="en-row${inset ? ' in' : ''}" data-act="dir"><span class="en-row-t">${t().dir}</span><span class="en-row-v"></span>${ICON.chevR}</button>`;
  // 一科一顆按鈕：▶ 加上這科還要花的時間；做完換成「完成」
  function subjBtn(id, small) {
    const tot = TODAY[id], dn = S.cnt[id], done = dn >= tot, pct = Math.round(dn / tot * 100);
    const ring = S.dv === 'B' && !small ? `<svg class="sb-ring" viewBox="0 0 108 40" preserveAspectRatio="none" aria-hidden="true"><rect class="tk" x="1" y="1" width="106" height="38" rx="19" pathLength="100"/>`
      + (pct ? `<rect class="pg" x="1" y="1" width="106" height="38" rx="19" pathLength="100" stroke-dasharray="${pct} 100"/>` : '') + '</svg>' : '';
    const label = done ? t().doneLbl : `${ICON.play}<span>${t().minBtn(mins(tot - dn))}</span>`;
    return `<button type="button" class="sb-btn${small ? ' sm' : ''}"${done ? ' disabled' : ` data-act="subj" data-s="${id}" aria-label="${t().startSubj(nm(subjById(id)))}"`}>${ring}<span class="sb-lbl">${label}</span></button>`;
  }
  function entryHTML() {
    const tot = ORDER.reduce((n, id) => n + TODAY[id], 0), dn = ORDER.reduce((n, id) => n + S.cnt[id], 0);
    // 建議先做的排第一：沒做完的在前，考試最近的先，同一天就剩比較多的先
    const key = id => { const d = examDate(id); return [S.cnt[id] >= TODAY[id] ? 1 : 0, d ? daysLeft(d) : 1e9, -(TODAY[id] - S.cnt[id])]; };
    const order = ORDER.slice().sort((a, b) => { const x = key(a), y = key(b); return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; });
    const rows = order.map(id => {
      const tot1 = TODAY[id], dn1 = S.cnt[id], done = dn1 >= tot1, d = examDate(id);
      const ex = S.ex && d ? `<span class="sb-ex">${examText(d)}</span>` : '';
      const bar = S.dv === 'A' ? `<i class="sb-bar" aria-hidden="true"><i style="width:${dn1 / tot1 * 100}%"></i></i>` : '';
      return `<div class="sb${done ? ' is-done' : ''}"><div class="sb-main"><span class="sb-l1"><span class="sb-name">${nm(subjById(id))}</span><span class="sb-n">${dn1}/${tot1}</span></span>${ex}</div>${subjBtn(id)}${bar}</div>`;
    });
    // 考前抽測：沒做完排第一，做完和做完的科目一起移到最下面；不算進「今日複習」
    if (checkOn()) {
      const ck = checkRow();
      S.checkDone ? rows.push(ck) : rows.unshift(ck);
    }
    return `<div class="en"><div class="en-top"><p class="sb-l1 en-today${dn >= tot ? ' is-done' : ''}"><span class="sb-name">${t().todayLbl}</span><span class="sb-n">${dn}/${tot}</span></p>${settingsBtn()}</div>
      <div class="en-scroll" data-scroll="entry"><div class="sb-list sb-${S.dv}">${rows.join('')}</div><p class="en-filter">${t().filtered}</p>
      ${dn >= tot ? `<button type="button" class="en-start is-soft sb-more" data-act="more">${t().more}</button>` : ''}
      <div class="en-group" style="margin-top:28px">${scopeRow(true)}${dirRow(true)}</div>${parentHTML()}</div><p class="en-mark" lang="en">Essence Cards</p></div>`;
  }
  // 考前抽測出現的時間：考試開始前 3 天到開始前一天（D-075）
  const checkOn = () => !!(S.scope && S.scope.start) && daysLeft(S.scope.start) > 0 && daysLeft(S.scope.start) <= 3;
  function checkRow() {
    const n = S.checkCnt, done = S.checkDone;
    const btn = done ? `<button type="button" class="sb-btn" data-act="check-res">${t().checkRes}</button>`
      : `<button type="button" class="sb-btn" data-act="check" aria-label="${t().check}"><span class="sb-lbl">${ICON.play}<span>${t().minBtn(7)}</span></span></button>`;
    return `<div class="sb${done ? ' is-done' : ''}"><div class="sb-main"><span class="sb-l1"><span class="sb-name">${t().check}</span><span class="sb-n">${n}/${CHECK_N}</span></span>`
      + `<span class="ck-sub">${t().checkSub}</span></div>${btn}<i class="sb-bar" aria-hidden="true"><i style="width:${n / CHECK_N * 100}%"></i></i></div>`;
  }
  const paItems = () => S.dev === 'desk' ? Object.keys(t().pa).filter(k => !S.paGone.has(k)) : [];
  function parentHTML() {
    const ks = paItems();
    if (!ks.length) return '';
    return `<section class="pa" aria-label="${t().parent}"><h2>${t().parent}</h2>` + ks.map(k => {
      const [txt, lbl] = t().pa[k];
      return `<div class="pa-row"><span class="pa-t">${txt}</span><button type="button" class="u-btn" data-act="pa" data-k="${k}">${lbl}</button></div>`;
    }).join('') + '</section>';
  }
  function checkResHTML() {
    const ok = 34, pct = Math.round(ok / CHECK_N * 100);
    const weak = WEAK.map(([id, a, b]) => { const u = unitById(id);
      return `<div class="ck-u"><span class="ck-un">${nm(subjById(u.subj))} ${u.name}<small>${t().weakN(a, b)}</small></span>`
        + `<button type="button" class="u-btn" data-act="prac" data-u="${id}">${ICON.play}${t().practice}</button></div>`; }).join('');
    return `<div class="en"><div class="en-top nav"><button type="button" class="ec-ico" data-act="nav-back" aria-label="${t().navBack}">${ICON.back}</button><h1 class="en-title">${t().checkDone}</h1><span></span></div>`
      + `<div class="en-scroll" data-scroll="checkres"><p class="ck-score">${ok}/${CHECK_N}<span>${pct}%</span></p><p class="ck-lead">${t().checkLead}</p>`
      + `<h2 class="ck-h">${t().weak}</h2><div>${weak}</div></div></div>`;
  }

  /* ---------- 目錄與管理（D-057、D-073） ---------- */
  const inScope = u => S.scope && S.scope.units.has(u.id);
  const dueOf = u => !ACTIVE(u) || S.udone.has(u.id) || S.done[u.subj] ? 0 : u.due;
  // 單元的狀態：灰＝一半以上還沒複習；藍＝全部記得以上；綠＝記得加很熟 80% 以上；橙＝其他（規則寫在說明書，畫面不解釋）
  function unitState(u) {
    const ts = u.targets, k = m => ts.filter(x => x[1] === m).length, ok = k('good') + k('easy');
    if (!ts.length) return 'new';
    if (k('new') > ts.length / 2) return 'new';
    if (ok === ts.length) return 'easy';
    return ok / ts.length >= 0.8 ? 'good' : 'near';
  }
  function unitHTML(u, mode) {
    const draft = u.status === 'draft';
    const open = mode !== 'scope' && S.open.has(u.id) && u.targets.length > 0;
    const state = u.status ? `<span class="tr-tag">${t()[u.status === 'filtered' ? 'filtered2' : u.status]}</span>` : '';
    const tags = (mode !== 'scope' && inScope(u) ? `<span class="tr-tag is-scope">${t().inScope}</span>` : '') + state;
    const exp = mode === 'scope' ? '' : `<button type="button" class="tr-exp${open ? ' is-open' : ''}" data-act="exp" data-u="${u.id}" aria-expanded="${open}" aria-label="${t().expand}"${u.targets.length ? '' : ' disabled'}>${ICON.chevR}</button>`;
    const num = draft ? '' : `<span class="tr-due" data-m="${unitState(u)}">${u.n}</span>`;
    let main, right = '';
    if (mode === 'browse') {
      main = draft ? `<button type="button" class="tr-name" data-act="note" data-u="${u.id}">${u.name}${tags}</button>`
        : `<button type="button" class="tr-name" data-act="exp" data-u="${u.id}">${u.name}${tags}</button>`;
      const d = dueOf(u);
      right = open ? `<span class="tr-ub"><button type="button" class="u-btn" data-act="utoday" data-u="${u.id}"${d ? '' : ' disabled'}>${ICON.play}${t().uToday(d)}</button>`
        + `<button type="button" class="u-btn" data-act="prac" data-u="${u.id}">${ICON.play}${t().uAll(u.n)}</button></span>` : num;
    } else {
      const on = mode === 'scope' ? S.scopeDraft.has(u.id) : S.sel.has(u.id);
      main = `<label class="tr-lab"><input type="checkbox" class="cb" data-u="${u.id}"${on ? ' checked' : ''}><span class="tr-name">${u.name}${tags}</span></label>`;
      if (mode === 'manage') right = num;
    }
    const ts = open ? `<ul class="tr-ts">${u.targets.map(([name, m], j) => mode === 'manage'
      ? `<li><label class="tr-t"><input type="checkbox" class="cb sm" data-t="${u.id}:${j}"${S.sel.has(`${u.id}:${j}`) ? ' checked' : ''}><i class="tr-dot" data-m="${m}"></i>${name}</label></li>`
      : `<li class="tr-t"><i class="tr-dot" data-m="${m}"></i>${name}</li>`).join('')}</ul>` : '';
    return `<div class="tr-u${open ? ' is-open' : ''}">${exp}${main}${right}</div>${ts}`;
  }
  // 學期 → 科目 → 單元；每個學期各自收合，預設只展開「目前學期」（設定頁）
  function treeHTML(mode) {
    const onlyToday = mode === 'browse' && S.dirView === 'today';
    const out = SEMS.filter(g => mode !== 'scope' || g.id !== 'ext').map(g => {
      const subs = SUBJ.map(s => {
        let us = UNITS.filter(u => u.sem === g.id && u.subj === s.id);
        if (onlyToday) us = us.filter(u => dueOf(u) > 0);
        if (!us.length) return '';
        const d = mode !== 'scope' && us.some(inScope) ? examDate(s.id) : '';
        const ex = d ? `<span class="tr-ex">${examText(d, true)}</span>` : '';
        const head = g.id === 'ext' ? '' : `<div class="tr-sh"><h2>${nm(s)}</h2>${ex}</div>`;
        return `<section>${head}${us.map(u => unitHTML(u, mode)).join('')}</section>`;
      }).join('');
      if (!subs) return '';
      const label = g.id === 'ext' ? nm(subjById('ext')) : g.name, on = onlyToday || S.semOpen.has(g.id);
      return `<div class="tr-g"><button type="button" class="tr-sem${on ? ' is-open' : ''}" data-act="sem" data-g="${g.id}" aria-expanded="${on}">${label}${ICON.chevR}</button>${on ? subs : ''}</div>`;
    }).join('');
    return out || `<p class="tr-none">${t().noneToday}</p>`;
  }
  function batchDock() {
    const n = S.sel.size;
    return `<div class="en-dock"><p class="tr-sel">${n ? t().selN(n) : t().noSel}</p><div class="tr-bb">`
      + Object.keys(t().b).map(b => `<button type="button" class="tr-b" data-act="batch" data-b="${b}"${n ? '' : ' disabled'}>${t().b[b]}</button>`).join('') + '</div></div>';
  }
  function dirHTML() {
    const seg = S.manage ? '' : `<div class="tr-bar"><div class="mini-seg" role="group" aria-label="${t().dir}">`
      + ['today', 'all'].map(v => `<button type="button" data-act="dview" data-v="${v}" aria-pressed="${S.dirView === v}">${t()[v === 'today' ? 'segToday' : 'segAll']}</button>`).join('') + '</div></div>';
    return `<div class="en"><div class="en-top nav"><button type="button" class="ec-ico" data-act="nav-back" aria-label="${t().navBack}">${ICON.back}</button>`
      + `<h1 class="en-title">${t().dir}</h1><button type="button" class="en-tbtn" data-act="manage">${S.manage ? t().finish : t().manage}</button></div>`
      + `<div class="en-scroll" data-scroll="dir">${S.manage ? '' : `<div class="en-group">${scopeRow(true)}</div>`}${seg}${treeHTML(S.manage ? 'manage' : 'browse')}</div>${S.manage ? batchDock() : ''}</div>`;
  }
  function scopeHTML() {
    return `<div class="en"><div class="en-top nav"><button type="button" class="ec-ico" data-act="nav-back" aria-label="${t().navBack}">${ICON.back}</button><h1 class="en-title">${t().scopeTitle}</h1><span></span></div>`
      + `<div class="en-scroll" data-scroll="scope"><p class="sc-lead">${t().scopeLead}</p>${treeHTML('scope')}</div>`
      + `<div class="en-dock"><div class="sc-date"><span>${t().period}<small>${t().optional}</small></span><span class="sc-dates">`
      + `<input type="date" id="scope-start" aria-label="${t().pStart}" value="${S.scopeStart}" min="${todayISO}"><span>～</span>`
      + `<input type="date" id="scope-end" aria-label="${t().pEnd}" value="${S.scopeEnd}" min="${S.scopeStart || todayISO}"></span></div>`
      + `<p class="sc-note">${t().dateNote}</p><button type="button" class="en-start" data-act="scope-ok">${t().ok}</button></div></div>`;
  }
  function openScope(from, preset) {
    S.scopeFrom = from;
    S.scopeDraft = new Set(preset || (S.scope ? S.scope.units : RECENT));
    S.scopeStart = S.scope ? S.scope.start : ''; S.scopeEnd = S.scope ? S.scope.end : '';

    if (b === 'scope') { S.manage = false; const pre = units.filter(id => !id.startsWith('x')); S.sel.clear(); return openScope(S.screen === 'dir' ? 'dir' : 'entry', pre.length ? pre : null); }
    if (b === 'prac') {
      const keys = new Set([...units, ...targets.map(k => k.split(':')[0])]);
      const cards = CARDS.filter(c => keys.has(c.unit));
      S.manage = false; S.sel.clear();
      if (!cards.length) toast(t().onlyDemo);
      return startReview({ mode: 'prac', cards: cards.length ? cards : CARDS.slice() });
    }
    const decks = new Set([...units, ...targets.map(k => k.split(':')[0])]);
    const cards = units.reduce((n, id) => n + Math.max(1, unitById(id).targets.length) * 2, 0) + targets.filter(k => !units.includes(k.split(':')[0])).length * 2;
    toast(t().updated(cards, decks.size), true);
  }

  /* ---------- 繪製 ---------- */
  function render() {
    const old = scr.querySelector('[data-scroll]'), key = old && old.dataset.scroll, top = old ? old.scrollTop : 0;
    app.lang = S.lang === 'en' ? 'en' : 'zh-Hant';
    scr.innerHTML = S.screen === 'review' ? reviewHTML() : S.screen === 'dir' ? dirHTML() : S.screen === 'scope' ? scopeHTML() : S.screen === 'checkres' ? checkResHTML() : entryHTML();
    // 電腦版的狀態列：有建議時多一行提示，點了打開入口（D-103）
    const st = $('ob-status'), n = paItems().length;
    app.classList.toggle('is-desk', S.dev === 'desk');
    st.hidden = S.dev !== 'desk';
    st.innerHTML = `<span>${t().words}</span>` + (n ? `<button type="button" data-act="status">${t().status(n)}</button>` : '');
    const nw = scr.querySelector('[data-scroll]');
    if (nw && nw.dataset.scroll === key) nw.scrollTop = top;
    syncBar();
  }
  let toastTimer;
  function toast(msg, undo = false) {
    toastEl.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button" data-act="undo">${t().undo}</button>` : ''}`;
    toastEl.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, undo ? 4000 : 2600);
  }

  function act(a, b) {
    switch (a) {
      case 'show': return reveal();
      case 'rate': return rate(b.dataset.k);
      case 'back': return back();
      case 'fwd': return fwd();
      case 'exit': case 'home': S.screen = S.from; S.view = null; return render();
      case 'more': return startReview({ mode: 'more' });
      case 'start': return startReview();
      case 'subj': return startReview({ subj: b.dataset.s });
      case 'prac': return startReview({ unit: b.dataset.u, mode: 'prac' });
      case 'prac-again': return startReview({ mode: 'prac', cards: S.deck });
      case 'dir': S.screen = 'dir'; S.manage = false; S.sel.clear(); return render();
      case 'scope': return openScope(S.screen === 'dir' ? 'dir' : 'entry');
      case 'scope-ok': {
        const a = $('scope-start'), z = $('scope-end'); if (a) S.scopeStart = a.value; if (z) S.scopeEnd = z.value;
        // 一次只有一份範圍（下一次大考）；只填開始日的話，結束日就是同一天
        const end = S.scopeStart && S.scopeEnd >= S.scopeStart ? S.scopeEnd : S.scopeStart;
        S.scope = S.scopeDraft.size ? { units: new Set(S.scopeDraft), start: S.scopeStart, end } : null;
        S.screen = S.scopeFrom; render(); return toast(t().scopeSaved);
      }
      case 'nav-back': S.screen = S.screen === 'scope' ? S.scopeFrom : 'entry'; S.manage = false; S.sel.clear(); return render();
      case 'manage': S.manage = !S.manage; S.sel.clear(); return render();
      case 'utoday': return startReview({ unit: b.dataset.u, mode: 'utoday' });
      case 'dview': S.dirView = b.dataset.v; return render();
      case 'sem': { const g = b.dataset.g; S.semOpen.has(g) ? S.semOpen.delete(g) : S.semOpen.add(g); return render(); }
      case 'note': return toast(t().draftNote);
      case 'exp': { const id = b.dataset.u; S.open.has(id) ? S.open.delete(id) : S.open.add(id); return render(); }
      case 'batch': return batch(b.dataset.b);
      case 'undo': return toast(t().undone);
      case 'settings': return toast(t().settingsToast);
      case 'check': return startReview({ mode: 'check', cards: CARDS.slice() });
      case 'check-res': S.screen = 'checkres'; return render();
      case 'status': S.screen = 'entry'; S.manage = false; S.sel.clear(); return render();
      case 'pa': {
        const k = b.dataset.k;
        if (k === 'skip') { S.paGone.add(k); return render(); }
        if (k === 'backlog') { S.screen = 'dir'; S.manage = true; S.sel.clear(); render(); }
        return toast(t().paToast[k]);
      }
      case 'src': { const w = b.closest('.ec-srcw'); if (w.classList.contains('is-tip')) return toast(t().srcOpen); w.classList.add('is-tip'); return; }
      case 'src-open': return toast(t().srcOpen);
      case 'say': { const c = S.deck[S.view != null ? S.hist[S.view].idx : S.i]; return say(c.say); }
    }
  }

  let sx = null, sy = 0, swipedAt = 0;
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b && app.contains(b)) { if (!b.disabled) act(b.dataset.act, b); return; }
    // 點畫面任何地方都能翻面（打字題除外，免得點輸入框附近就看到答案）
    if (S.screen === 'review' && e.target.closest('.ec-stage') && !e.target.closest('input, label') && Date.now() - swipedAt > 400) {
      const c = S.deck[S.i];
      if (c && !c.spell && S.view == null) reveal();
    }
  });
  app.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'scope-start') { S.scopeStart = el.value; const z = $('scope-end'); if (z) { z.min = el.value; if (!z.value || z.value < el.value) z.value = el.value; S.scopeEnd = z.value; } return; }
    if (el.id === 'scope-end') { S.scopeEnd = el.value; return; }
    if (!el.classList.contains('cb')) return;
    const id = el.dataset.u || el.dataset.t, set = S.screen === 'scope' ? S.scopeDraft : S.sel;
    el.checked ? set.add(id) : set.delete(id);
    if (S.screen !== 'scope') render();
  });
  app.addEventListener('input', e => {
    if (e.target.id !== 'spell-input') return;
    S.typed = e.target.value;
    const sb = $('show-btn'); if (sb) sb.textContent = S.typed.trim() ? t().check : t().show;
    const ib = $('spell-btn'); if (ib) ib.outerHTML = inbtnHTML();
  });
  // 回看上一張：手指往右滑是上一張，往左滑回到目前這張；上下捲動不算（D-084）
  app.addEventListener('touchstart', e => {
    if (S.screen !== 'review' || !e.target.closest('.ec-stage')) { sx = null; return; }
    const p = e.touches[0]; sx = p.clientX; sy = p.clientY;
  }, { passive: true });
  app.addEventListener('touchend', e => {
    if (sx == null) return;
    const p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 1.6 * Math.abs(dy)) { swipedAt = Date.now(); dx > 0 ? back() : fwd(); }
  }, { passive: true });
  addEventListener('keydown', e => {
    if (S.screen !== 'review') return;
    const tg = e.target;
    if (tg.closest && tg.closest('.mk-bar')) return;
    if (tg.id === 'spell-input') { if (e.key === 'Enter') { e.preventDefault(); reveal(); } return; }
    if (e.key === 'ArrowLeft') return back();
    if (e.key === 'ArrowRight') return fwd();
    if (tg.closest && tg.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    if ((e.key === ' ' || e.key === 'Enter') && !S.revealed && S.view == null) { e.preventDefault(); reveal(); }
    else if (/^[1-4]$/.test(e.key)) rate(KEYS[e.key - 1]);
  });

  /* ---------- 控制列 ---------- */
  function syncBar() {
    const scrKey = S.screen === 'review' ? 'review' : 'entry';
    const on = { 'seg-screen': scrKey, 'seg-theme': root.dataset.theme || (DARK.matches ? 'dark' : 'light'), 'seg-lang': S.lang, 'seg-ex': S.ex ? 'on' : 'off', 'seg-dev': S.dev, 'seg-near': S.near ? 'near' : 'far' };
    for (const id in on) document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === on[id])));
    $('seg-ex').hidden = $('seg-near').hidden = $('var-lab').hidden = scrKey === 'review';
    $('var-lab').textContent = '入口';
    $('hint').textContent = S.screen === 'review' ? (S.mode === 'check' ? HINT.near : HINT[S.rv]) : S.screen === 'scope' ? HINT.scope
      : S.screen === 'dir' ? HINT.dir : S.screen === 'checkres' ? HINT.near
      : [S.near ? HINT.near : HINT['e' + S.dv], S.dev === 'desk' ? HINT.desk : ''].filter(Boolean).join(' ');
    mk.classList.toggle('is-folded', S.fold);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ theme: root.dataset.theme || '', lang: S.lang, rv: S.rv, dv: S.dv, ex: S.ex, screen: S.screen === 'review' ? 'review' : 'entry', fold: S.fold, dev: S.dev, near: S.near })); } catch (e) {}
  }
  document.querySelector('.mk-bar').addEventListener('click', e => {
    const b = e.target.closest('.seg button');
    if (e.target.closest('#mk-fold')) { S.fold = true; syncBar(); save(); return; }
    if (!b) return;
    const g = b.parentElement.id, v = b.dataset.v;
    if (g === 'seg-theme') root.dataset.theme = v;
    else if (g === 'seg-lang') S.lang = v;
    else if (g === 'seg-dv') S.dv = v;
    else if (g === 'seg-ex') S.ex = v === 'on';
    else if (g === 'seg-dev') S.dev = v;
    else if (g === 'seg-near') { S.near = v === 'near'; setExam(); S.checkCnt = 0; S.checkDone = false; if (S.screen === 'checkres') S.screen = 'entry'; }
    else if (g === 'seg-rv') { S.rv = v; if (S.screen === 'review' && S.view == null) { S.revealed = false; S.spell = null; } }
    else if (g === 'seg-screen') {
      if (v === 'review') return (startReview({ mode: 'demo' }), save());
      S.screen = 'entry'; S.manage = false; S.sel.clear();
    }
    render(); save();
  });
  $('mk-unfold').addEventListener('click', () => { S.fold = false; syncBar(); save(); });
  if (DARK.addEventListener) DARK.addEventListener('change', syncBar);

  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (s.theme === 'light' || s.theme === 'dark') root.dataset.theme = s.theme;
    if (s.lang === 'en') S.lang = 'en';
    if (s.ex === false) S.ex = false;
    if (s.screen === 'entry') S.screen = 'entry';
    S.fold = s.fold === true;
    if (s.dev === 'desk') S.dev = 'desk';
    if (s.near === true) S.near = true;
  } catch (e) {}
  const addDays = n => { const d = new Date(todayISO + 'T00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  // 範例：段考分兩天考；「考前 3 天」把考試期間移到 3 天後
  function setExam() { const n = S.near ? 3 : 12; S.scope = { units: S.scope ? S.scope.units : new Set(RECENT), start: addDays(n), end: addDays(n + 1) }; }
  setExam();
  if (S.screen === 'review') startReview({ mode: 'demo' }); else render();
})();
</script>
