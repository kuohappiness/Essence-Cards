<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#224f47">
<meta name="description" content="Essence Cards 設計討論平台：共同規劃知識學習工具，收集點子、研究參考軟體、整理任務與共識。">
<title>Essence Cards · 設計討論平台</title>
<style>
:root{--ink:#243c36;--muted:#64736c;--paper:#f7f7f0;--line:#dce2d7;--green:#28594e;--amber:#8b6125;--blue:#446281;--shadow:0 5px 20px #223a3210}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}a{color:var(--green);text-underline-offset:3px}button:focus-visible,a:focus-visible{outline:3px solid #bd842e;outline-offset:4px}button{touch-action:manipulation}.skip{position:absolute;left:16px;top:-80px;z-index:9;background:white;padding:8px}.skip:focus{top:10px}
header{padding:28px 4vw 20px;border-bottom:1px solid var(--line);background:#fbfbf6}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:13px;align-items:center}.mark{position:relative;width:34px;height:42px}.mark:before,.mark:after{content:"";position:absolute;width:25px;height:32px;border:1.5px solid var(--green);border-radius:5px;top:5px;left:2px;transform:rotate(-13deg)}.mark:after{background:#e5eee1;transform:rotate(7deg);left:8px}.wordmark{font:29px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-1px}.submark{font-size:10px;letter-spacing:2.8px;color:var(--muted);margin-top:6px}.repo{font-size:13px;text-decoration:none;border:1px solid var(--line);padding:7px 13px;border-radius:20px;white-space:nowrap}.intro{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-top:30px}h1{font-size:27px;font-weight:600;letter-spacing:.7px;line-height:1.4;margin:0 0 5px}p{margin:0} .intro p{color:var(--muted)}.meta{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.toolbar{padding:16px 4vw;display:flex;align-items:center;justify-content:space-between;gap:20px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{border:0;border-radius:7px;background:transparent;padding:7px 15px;font-size:13px;color:var(--muted)}.tabs button[aria-pressed=true]{background:var(--green);color:#fff}.hint{font-size:12px;color:var(--muted)}main{min-height:55vh}.stage{padding:8px 4vw 32px}.board{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:24px;align-items:start}.lane{min-width:0}.lanehead{display:flex;align-items:center;gap:9px;padding:0 0 13px;border-bottom:1px solid var(--line);margin-bottom:17px}.dot{height:8px;width:8px;border-radius:50%;background:var(--green)}.ideas .dot{background:#b88638}.tasks .dot{background:#6082a2}.lane h2{font-size:14px;letter-spacing:1px;font-weight:600;margin:0}.count{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:0 7px;color:var(--muted);margin-left:auto}.lane-description{font-size:12px;color:var(--muted);margin:-6px 0 17px}.card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fffefa;padding:19px 19px 16px;box-shadow:var(--shadow);margin-bottom:13px;transition:box-shadow .2s,border-color .2s;overflow-wrap:anywhere}.card:hover{border-color:#8fa99a;box-shadow:0 6px 22px #223a3220}.ideas .card{background:#fffbf1;border-color:#e5d5b7}.card-top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}.ident{font-size:10px;font-family:ui-monospace,monospace;letter-spacing:1px;color:var(--muted)}.badge{font-size:10px;border-radius:4px;padding:2px 7px;background:#eaf0e8;color:#355a40}.ideas .badge{background:#f4e7cb;color:#805c28}.tasks .badge{background:#e9eef5;color:#456783}.card h3{font-size:16px;line-height:1.6;margin:0 0 8px;font-weight:600}.summary{font-size:13px;line-height:1.9;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.card-foot{margin-top:16px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.card-foot span:last-child{font-size:16px;line-height:1}.empty{font-size:13px;color:var(--muted);padding:20px 0}.source{font-size:12px;display:inline-block;margin-top:15px}.detail{font-size:14px;line-height:1.9;overflow-wrap:anywhere}.detail p{margin:0 0 12px}.detail ul{padding-left:22px;margin:0 0 12px}.detail blockquote{margin:0 0 15px;padding:9px 15px;border-left:3px solid #b9b98b;background:#f7f7ed}.detail code{background:#f0f2eb;padding:1px 4px;border-radius:3px;font-size:12px}
.stage.canvas{height:66vh;min-height:420px;max-height:850px;overflow:hidden;position:relative;padding:0;background-image:radial-gradient(#bdc9bc 1px,transparent 1px);background-size:22px 22px;border-block:1px solid var(--line);touch-action:none;cursor:grab}.stage.canvas.dragging{cursor:grabbing}.canvas .board{width:1180px;position:absolute;left:0;top:0;transform-origin:0 0;padding:26px;gap:24px}.canvas .lanehead{background:var(--paper);padding:6px 8px}.canvas .lane-description{background:var(--paper);padding:0 8px}.zoom{display:flex;gap:6px;align-items:center}.zoom button{min-width:36px;border:1px solid var(--line);border-radius:7px;background:#fffefa;padding:4px 9px;font-size:13px}.zoom output{min-width:40px;text-align:center;font-size:12px}.zoom[hidden]{display:none}.outline .board{display:block;max-width:860px;margin:auto}.outline .lane{margin-bottom:35px}.outline .card{cursor:default;padding:24px}.outline .card:hover{box-shadow:var(--shadow);border-color:var(--line)}.outline .card h3{font-size:18px;margin-bottom:17px}.reference-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:1050px;margin:0 auto;padding-top:14px}.reference-intro{max-width:1050px;margin:4px auto 18px;font-size:14px;color:var(--muted)}.reference-grid .card{padding:26px}.reference-grid h2{font:27px Georgia,serif;margin:8px 0 14px}.reference-grid .badge{background:#f2e9d4;color:var(--amber)}
footer{padding:17px 4vw 25px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:20px}dialog{width:min(640px,calc(100% - 32px));max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:15px;padding:30px;background:#fffefa;color:var(--ink);box-shadow:0 24px 80px #1e322530}dialog::backdrop{background:#253b3670;backdrop-filter:blur(3px)}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:12px}.close{border:1px solid var(--line);border-radius:6px;background:transparent;padding:3px 10px;font-size:13px}dialog h2{font-size:23px;line-height:1.5;margin:0 0 20px}.static-references{margin-top:35px}.static-references h2{font-size:14px;margin:0}.static-references .reference-grid{max-width:none}.static-references .reference-intro{max-width:none}
@media(max-width:850px){.board{gap:14px}.card{padding:15px}.intro{display:block}.meta{text-align:left;margin-top:14px}.toolbar{flex-wrap:wrap;gap:10px}.hint{display:none}.board{grid-template-columns:1fr 1fr}.consensus{grid-column:1/-1}.consensus .cards{display:grid;grid-template-columns:1fr 1fr;gap:13px}.consensus .card{margin:0}.outline .consensus .cards,.canvas .consensus .cards{display:block}.canvas .board{grid-template-columns:1fr 1fr 1.1fr}.canvas .consensus{grid-column:auto}}@media(max-width:540px){header{padding:23px 20px 17px}.wordmark{font-size:25px}.repo{font-size:11px;padding:5px 10px}.intro{margin-top:26px}h1{font-size:24px}.intro p{font-size:13px}.toolbar{padding:14px 16px}.tabs{gap:1px}.tabs button{padding:7px 11px}.stage{padding:5px 20px 24px}.board{grid-template-columns:1fr;gap:28px}.consensus .cards{display:block}.consensus .card{margin-bottom:13px}.card{padding:20px}.reference-grid{grid-template-columns:1fr}.reference-grid .card{padding:22px}.reference-intro{font-size:13px}.lanehead{margin-bottom:16px}footer{padding:16px 20px;display:block}footer p+p{margin-top:5px}dialog{padding:22px}.outline .card{padding:20px}.stage.canvas{height:60vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{header{padding:10px}.toolbar,.repo,.card-foot,footer{display:none}.stage{padding:0!important;height:auto!important;overflow:visible!important}.board,.canvas .board{position:static!important;transform:none!important;width:auto!important;display:block}.card{break-inside:avoid;box-shadow:none}.consensus .cards{display:block}}
</style>
</head>
<body>
<a class="skip" href="#main">跳至看板內容</a>
<header>
 <div class="topline"><div class="brand"><span class="mark" aria-hidden="true"></span><div><div class="wordmark">Essence Cards</div><div class="submark">DESIGN WORKSPACE</div></div></div><a class="repo" href="https://github.com/kuohappiness/Essence-Cards" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
 <div class="intro"><div><h1>設計討論平台</h1><p>共同規劃知識學習工具：收集點子、研究參考軟體、整理任務與共識。</p></div><p class="meta" id="meta">__BOARD_META__</p></div>
</header>
<nav class="toolbar" id="toolbar" aria-label="看板檢視" hidden>
 <div class="tabs"><button data-view="board" aria-pressed="true">看板</button><button data-view="canvas" aria-pressed="false">自由畫板</button><button data-view="outline" aria-pressed="false">文字綱要</button><button data-view="references" aria-pressed="false">參考軟體</button></div>
 <span class="hint" id="hint">點開卡片，查看原意與下一步</span>
 <div class="zoom" id="zoom" hidden><button id="zoom-out" aria-label="縮小">−</button><output id="scale" aria-live="polite">100%</output><button id="zoom-in" aria-label="放大">＋</button><button id="fit">全覽</button></div>
</nav>
<main id="main" tabindex="-1"><div class="stage" id="static-content">__STATIC_CONTENT__</div><div class="stage" id="stage" hidden><div class="board" id="board"></div></div></main>
<footer><p>這裡的卡片記錄討論事項；學習工具的操作介面另行設計。</p><p>討論點子 · 研究參考 · 設計共識</p></footer>
<dialog id="detail-dialog" aria-labelledby="detail-title"><div class="dialog-top"><span class="ident" id="detail-id"></span><button class="close" id="close-dialog" autofocus>關閉 ×</button></div><h2 id="detail-title"></h2><div class="detail" id="detail-body"></div><a class="source" id="detail-source" target="_blank" rel="noopener noreferrer">查看來源文件 ↗</a></dialog>
<script id="board-data" type="application/json">__BOARD_DATA__</script>
<script>
'use strict';
// Keep the complete static content until every initialization step succeeds.
(() => {
try {
const data=JSON.parse(document.getElementById('board-data').textContent);
const stage=document.getElementById('stage'), board=document.getElementById('board'), dialog=document.getElementById('detail-dialog');
if(typeof dialog.showModal!=='function')throw Error('Dialog support unavailable');
const groups=[['ideas','待釐清點子','先留下原意，之後逐項討論'],['tasks','目前任務','掌握進度與下一步'],['consensus','最新共識','已確認、目前有效的方向']];
let view='board', x=0, y=0, scale=1, drag=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeURL(raw,source){try{let url=new URL(raw,source);return ['https:','http:'].includes(url.protocol)?url.href:null}catch{return null}}
function inline(text,source){
 let out='', end=0;const pattern=/\[([^\]]+)\]\(([^\s)]+)\)|<(https?:\/\/[^>]+)>|\*\*([^*]+)\*\*|`([^`]+)`/g;let m;
 while((m=pattern.exec(text))){out+=esc(text.slice(end,m.index));if(m[1]||m[3]){const href=safeURL(m[2]||m[3],source);out+=href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(m[1]||m[3])}</a>`:esc(m[1]||m[3]);}else if(m[4])out+=`<strong>${esc(m[4])}</strong>`;else out+=`<code>${esc(m[5])}</code>`;end=pattern.lastIndex;}return out+esc(text.slice(end));
}
function markdown(text,source){return text.split(/\n\s*\n/).map(block=>{const lines=block.split('\n');if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>'<li>'+inline(l.slice(2),source)+'</li>').join('')+'</ul>';if(lines.every(l=>l.startsWith('> ')))return '<blockquote>'+inline(lines.map(l=>l.slice(2)).join('\n'),source)+'</blockquote>';return '<p>'+lines.map(l=>inline(l,source)).join('<br>')+'</p>';}).join('')}
function cardHTML(card,full=false){return `<div class="card-top"><span class="ident">${esc(card.id)}</span><span class="badge">${esc(card.status)}</span></div><h3>${esc(card.title)}</h3>`+(full?`<div class="detail">${markdown(card.body,card.source)}</div><a class="source" href="${esc(card.source)}" target="_blank" rel="noopener noreferrer">查看來源文件 ↗</a>`:`<p class="summary">${esc(card.summary)}</p><div class="card-foot"><span>查看細節</span><span aria-hidden="true">↗</span></div>`)}
function openCard(card){document.getElementById('detail-id').textContent=card.id+' / '+card.status;document.getElementById('detail-title').textContent=card.title;document.getElementById('detail-body').innerHTML=markdown(card.body,card.source);document.getElementById('detail-source').href=card.source;dialog.showModal()}
function render(){
 board.replaceChildren();board.className=view==='references'?'reference-grid':'board';stage.className='stage'+(view==='canvas'?' canvas':view==='outline'?' outline':'');board.style.transform='';document.querySelector('.reference-intro')?.remove();
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.getElementById('zoom').hidden=view!=='canvas';document.getElementById('hint').hidden=view==='canvas';document.getElementById('hint').textContent=view==='references'?'參考收錄 ≠ 決定採用':'點開卡片，查看原意與下一步';
 if(view==='references'){
  const intro=document.createElement('p');intro.className='reference-intro';intro.textContent='設計討論的研究資料：先比較其他軟體的閃卡功能與使用體驗，再討論可借鑑之處。每項參考保留來源與查核狀態。';stage.prepend(intro);
  data.references.forEach(card=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="card-top"><span class="ident">${esc(card.id)}</span><span class="badge">${esc(card.status)}</span></div><h2>${esc(card.title)}</h2><div class="detail">${markdown(card.body,card.source)}</div>`;board.append(el)});
 }else groups.forEach(([key,title,note])=>{const lane=document.createElement('section');lane.className='lane '+key;lane.innerHTML=`<div class="lanehead"><span class="dot" aria-hidden="true"></span><h2>${title}</h2><span class="count">${data[key].length}</span></div><p class="lane-description">${note}</p><div class="cards"></div>`;const holder=lane.querySelector('.cards');data[key].forEach(card=>{const el=document.createElement(view==='outline'?'article':'button');el.className='card';el.dataset.id=card.id;el.innerHTML=cardHTML(card,view==='outline');if(view!=='outline')el.addEventListener('click',()=>openCard(card));holder.append(el)});if(!data[key].length)holder.innerHTML='<p class="empty">目前沒有項目</p>';board.append(lane)});
 if(view==='canvas')requestAnimationFrame(fit);
}
function transform(){board.style.transform=`translate(${x}px,${y}px) scale(${scale})`;document.getElementById('scale').value=Math.round(scale*100)+'%'}
function fit(){if(view!=='canvas')return;scale=Math.min(1,(stage.clientWidth-30)/board.offsetWidth,(stage.clientHeight-30)/board.offsetHeight);scale=Math.max(.12,scale);x=(stage.clientWidth-board.offsetWidth*scale)/2;y=15;transform()}
function zoomAt(factor,cx=stage.clientWidth/2,cy=stage.clientHeight/2){const next=Math.max(.12,Math.min(2,scale*factor));x=cx-(cx-x)*next/scale;y=cy-(cy-y)*next/scale;scale=next;transform()}
document.getElementById('meta').textContent='共識 v'+data.version+' · '+data.updated;
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));
document.getElementById('close-dialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.getElementById('zoom-in').addEventListener('click',()=>zoomAt(1.2));document.getElementById('zoom-out').addEventListener('click',()=>zoomAt(1/1.2));document.getElementById('fit').addEventListener('click',fit);
stage.addEventListener('wheel',e=>{if(view!=='canvas')return;e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
stage.addEventListener('pointerdown',e=>{if(view!=='canvas'||e.target.closest('button,a')||e.button!==0)return;drag={id:e.pointerId,px:e.clientX,py:e.clientY,x,y};stage.setPointerCapture(e.pointerId);stage.classList.add('dragging')});
stage.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;x=drag.x+e.clientX-drag.px;y=drag.y+e.clientY-drag.py;transform()});
for(const event of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(event,()=>{drag=null;stage.classList.remove('dragging')});
window.addEventListener('resize',()=>{if(view==='canvas')fit()});render();
document.getElementById('static-content').hidden=true;
stage.hidden=false;
document.getElementById('toolbar').hidden=false;
} catch (error) {
 document.getElementById('static-content').hidden=false;
 document.getElementById('stage').hidden=true;
 document.getElementById('toolbar').hidden=true;
 console.error('Interactive board initialization failed; static content remains available.', error);
}
})();
</script>
</body>
</html>
